<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<title>BL■CKS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --border: #e9e5e0;
    --grid-bg: #f7f6f3;
    --grid-line: #e3ddd6;
    --text: #37352f;
    --dim: #9b9a97;
    --accent: #d9730d;
    --accent-dim: rgba(217, 115, 13, 0.08);
    --contingency: #448361;
    --header-bg: #f8f8f8;
    --row-alt: #fcfbf9;
    --cell-size: 40px;
    --row-header-width: 300px;
    --resource-summary-width: 112px;
    --alt-bg: #f8f8f8;
  }

  /* day-unit spans inherit surrounding text colour */
  .cg { color: inherit; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    padding: 0.6rem 1.2rem;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    gap: 1rem;
    flex-shrink: 0;
    z-index: 10;
  }

  .topbar h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
  }

  .topbar-controls {
    display: flex;
    gap: 0.4rem;
    margin-left: 0;
  }

  .topbar-status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-left: auto;
    justify-content: flex-end;
  }

  .topbar button {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.35rem 0.8rem;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 400;
  }

  .topbar button:hover { color: var(--text); background: var(--header-bg); }
  .topbar button.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* Grid area */
  .grid-area {
    flex: 1;
    position: relative;
    overflow: auto;
    cursor: default;
    min-height: 0; /* Override default stretch, rows determine height */
  }

  .grid-wrapper {
    position: relative;
    min-width: 100%;
    min-height: 0;
    flex: 1;
  }

  /* Column headers (timeline) */
  .col-headers-wrap {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #f8f8f8;
  }

  .col-headers {
    display: flex;
    border-bottom: 1px solid var(--border);
    width: max-content;
    min-width: 100%;
  }

  .row-header-spacer {
    width: var(--row-header-width);
    min-width: var(--row-header-width);
    border-right: 1px solid var(--border);
    background: #f8f8f8;
    position: sticky;
    left: 0;
    z-index: 2;
    flex-shrink: 0;
  }

  .col-header {
    width: var(--cell-size);
    min-width: var(--cell-size);
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: #666;
    border-right: 1px solid var(--border);
    user-select: none;
    font-family: inherit;
    background: #f8f8f8;
  }

  /* Alternating banding on header rows for readability. nth-child(1) is
     the row-header-spacer, so nth-child(even) hits the 1st, 3rd, 5th ... span. */
  .col-header:nth-child(even) { background: var(--alt-bg); }
  .month-span:nth-child(even) { background: var(--alt-bg); }
  .week-span:nth-child(even)  { background: var(--alt-bg); }

  .today-bubble {
    display: inline-block;
    background: rgba(40, 54, 62, 0.92);
    color: #fff;
    border-radius: 5px;
    padding: 0.1rem 0.35rem;
    font-size: 0.72rem;
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
  }


  /* Month header row */
  .month-span {
    height: 22px;
    display: flex;
    align-items: center;
    padding-left: 6px;
    font-size: 0.75rem;
    font-weight: 400;
    color: #666;
    border-right: 1px solid #ccc;
    font-family: inherit;
    background: #f8f8f8;
  }

  /* Week header row */
  .week-span {
    height: 22px;
    display: flex;
    align-items: center;
    padding-left: 6px;
    font-size: 0.75rem;
    font-weight: 400;
    color: #666;
    border-right: 1px solid var(--border);
    font-family: inherit;
    background: #f8f8f8;
  }

  /* Rows */
  .row {
    display: flex;
    border-bottom: 1px solid var(--grid-line);
    position: relative;
    width: max-content;
    min-width: 100%;
    height: var(--row-h, var(--cell-size));
  }
  .row-resize {
    position: absolute;
    bottom: -3px;
    left: 0;
    right: 0;
    height: 7px;
    cursor: row-resize;
    z-index: 10;
    touch-action: none;
  }
  .row-resize::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 3px;
    height: 2px;
    background: rgba(0,0,0,0.08);
  }
  .row-resize:hover::after,
  .row-resize.dragging::after {
    background: rgba(0,0,0,0.16);
  }

  .row.resizing { user-select: none; }

  /* Horizontal resize handle on the right edge of the left header column */
  .header-col-resize {
    position: absolute;
    top: 0;
    right: -3px;
    width: 7px;
    height: 100%;
    cursor: col-resize;
    z-index: 80;
    touch-action: none;
  }
  .header-col-resize::after {
    content: '';
    position: absolute;
    right: 3px;
    top: 0;
    width: 2px;
    height: 100%;
    background: rgba(0,0,0,0.08);
  }
  .header-col-resize:hover::after,
  .header-col-resize.dragging::after { background: rgba(0,0,0,0.16); }
  body.col-resizing { cursor: col-resize; user-select: none; }
  body.col-resizing * { cursor: col-resize !important; }

  .row-header {
    width: var(--row-header-width);
    min-width: var(--row-header-width);
    padding: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 3px;
    border-right: 1px solid var(--border);
    background: #f8f8f8;
    position: sticky;
    left: 0;
    z-index: 3;
    font-size: 14px;
    font-weight: 500;
    cursor: text;
    height: 100%;
  }
  .row-header-main {
    display: flex;
    align-items: stretch;
    width: 100%;
    flex: 1;
    min-height: 0;
    padding-left: 0.4rem;
  }
  .resource-summary {
    width: var(--resource-summary-width);
    flex: 0 0 var(--resource-summary-width);
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 0.5rem 0.4rem 0.3rem 0.5rem;
    border-right: 1px solid rgba(0,0,0,0.10);
    position: relative;
  }
  .summary-col-resize {
    position: absolute;
    top: 0;
    right: -3px;
    width: 7px;
    height: 100%;
    cursor: col-resize;
    z-index: 90;
    touch-action: none;
  }
  .summary-col-resize::after {
    content: '';
    position: absolute;
    right: 3px;
    top: 0;
    width: 2px;
    height: 100%;
    background: rgba(0,0,0,0.08);
  }
  .summary-col-resize:hover::after,
  .summary-col-resize.dragging::after { background: rgba(0,0,0,0.16); }
  .track-panel {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
    padding-left: 0.45rem;
  }
  .row-header-tags {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 3px;
    flex: 0 0 auto;
    min-height: 0;
    margin-top: 5px;
    margin-bottom: 0.15rem;
  }
  .track-list {
    display: flex;
    flex-direction: column;
    gap: 0;
    flex: 1;
    min-height: 0;
  }
  .track-label-row {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    height: var(--track-h, 40px);
    min-height: var(--track-h, 40px);
    flex: 0 0 var(--track-h, 40px);
    padding-right: 0.4rem;
    border-bottom: 1px solid var(--grid-line);
    position: relative;
  }
  .track-list > .track-label-row:last-child { border-bottom: none; }
  .track-drag-handle {
    cursor: grab;
    color: #bbb;
    font-size: 1rem;
    line-height: 1;
    padding: 0 4px 0 0;
    flex: 0 0 auto;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 16px;
  }
  .track-drag-handle:hover { color: #999; }
  .track-label-input {
    flex: 1;
    min-width: 0;
    font-size: 0.78rem !important;
    font-weight: 400 !important;
    color: var(--dim) !important;
  }
  .track-delete-btn {
    border: none;
    background: transparent;
    color: #aaa;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.75rem;
    padding: 0.05rem 0.2rem;
  }
  .track-delete-btn:hover { color: #dc2626; }
  .track-add-row {
    display: flex;
    align-items: center;
    height: var(--add-track-h, 22px);
    min-height: var(--add-track-h, 22px);
    flex: 0 0 var(--add-track-h, 22px);
    padding-left: 0.2rem;
    font-size: 0.68rem;
    color: #cbcbcb;
    cursor: pointer;
    user-select: none;
  }
  .track-add-row:hover { color: var(--accent); }
  .tag-chip {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    background: rgba(40,54,62,0.08);
    color: #444;
    border: 1px solid rgba(0,0,0,0.04);
    border-radius: 4px;
    padding: 0 0.3rem;
    height: 20px;
    font-size: 0.68rem;
    font-weight: 500;
    line-height: 1;
    white-space: nowrap;
    cursor: default;
  }
  .tag-chip-remove {
    background: none;
    border: none;
    padding: 0;
    margin-left: 1px;
    font-size: 0.75rem;
    line-height: 1;
    color: #888;
    cursor: pointer;
    font-family: inherit;
  }
  .tag-chip.tag-color-0 { background: #fde2e4; color: #6f3338; }
  .tag-chip.tag-color-1 { background: #fad2e1; color: #71334d; }
  .tag-chip.tag-color-2 { background: #e2ece9; color: #2f5b50; }
  .tag-chip.tag-color-3 { background: #bee1e6; color: #275a62; }
  .tag-chip.tag-color-4 { background: #dfe7fd; color: #344879; }
  .tag-chip.tag-color-5 { background: #cddafd; color: #344273; }
  .tag-chip.tag-color-6 { background: #fff1cc; color: #765b1f; }
  .tag-chip.tag-color-7 { background: #d8f3dc; color: #2f6540; }
  .tag-chip.tag-color-8 { background: #f1e4ff; color: #5b3d72; }
  .tag-chip.tag-color-9 { background: #ffd6ba; color: #79442b; }
  .tag-chip-remove:hover { color: #dc2626; }
  .tag-add-btn {
    display: inline-flex;
    align-items: center;
    background: none;
    border: 1px dashed #bbb;
    border-radius: 4px;
    padding: 0 0.28rem;
    height: 20px;
    font-size: 0.68rem;
    color: #aaa;
    cursor: pointer;
    line-height: 1;
    font-family: inherit;
  }
  .tag-add-btn:hover { border-color: #888; color: #555; }
  .tag-add-input {
    font-family: inherit;
    font-size: 0.68rem;
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 0 0.3rem;
    height: 20px;
    line-height: 1;
    outline: none;
    width: 5rem;
    background: #fff;
    color: #333;
  }

  .row-header input {
    background: none;
    border: none;
    color: #555;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    outline: none;
  }

  .row-label-input {
    width: 100%;
    min-width: 0;
    flex: 0 0 auto;
    font-size: 15px;
    margin-bottom: 4px;
  }

  .capacity-control {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0 0.05rem;
    color: var(--dim);
    font-size: 0.68rem;
    font-weight: 400;
    line-height: 1.15;
    flex: 0 0 auto;
  }

  .row-header input.capacity-input {
    width: 2.7em;
    text-align: right;
    font-size: 0.68rem;
    font-weight: 400;
    color: var(--dim);
    padding: 0;
    appearance: textfield;
    -moz-appearance: textfield;
  }
  .row-header input.capacity-input::-webkit-outer-spin-button,
  .row-header input.capacity-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .row-header input::placeholder { color: #ccc; }
  .resource-delete-btn {
    position: absolute;
    top: 2px;
    left: 3px;
    z-index: 4;
    border: none;
    background: transparent;
    color: #bbb;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    line-height: 1;
    padding: 0.05rem 0.2rem;
    border-radius: 4px;
  }
  .resource-delete-btn:hover { color: #dc2626; background: rgba(220,38,38,0.08); }

  .row-cells {
    display: flex;
    flex-direction: column;
    position: relative;
    flex: 0 0 auto;
    height: 100%;
  }
  .resource-group {
    display: flex;
    position: relative;
    width: max-content;
    min-width: 100%;
    height: var(--row-h, auto);
    border-bottom: 1px solid var(--grid-line);
  }
  .resource-group-header {
    flex: 0 0 var(--row-header-width);
    align-self: stretch;
  }
  .resource-row-resize {
    z-index: 200;
    pointer-events: auto;
  }
  .track-row-resize {
    z-index: 65;
  }
  .track-row-resize::after {
    height: 1px;
    background: rgba(0,0,0,0.05);
  }
  .track-row-resize:hover::after,
  .track-row-resize.dragging::after { background: rgba(0,0,0,0.11); }
  .resource-track-stack {
    display: flex;
    flex-direction: column;
    flex: 0 0 auto;
  }
  .track-grid-row {
    flex: 0 0 auto;
    border-bottom: 1px solid var(--grid-line);
  }
  .resource-track-stack > .track-grid-row:last-child { border-bottom: none; }
  .track-row-cells {
    display: block;
    height: 100%;
  }
  .track-add-lane {
    cursor: pointer;
    background: rgba(0,0,0,0.015);
  }
  .track-add-lane:hover { background: rgba(245,166,35,0.06); }

  /* Painted grid backgrounds — repeating gradients are dramatically faster
     than one DOM node per day for thousands of columns. Solid grey fill
     + darker vertical gridlines. Stride changes between zoom modes. */
  .row-cells.painted-day {
    background-color: var(--grid-bg);
    background-image: repeating-linear-gradient(
      to right,
      transparent 0, transparent 39px,
      var(--grid-line) 39px, var(--grid-line) 40px
    );
  }
  .row-cells.painted-week {
    background-color: var(--grid-bg);
    background-image: repeating-linear-gradient(
      to right,
      transparent 0, transparent 79px,
      var(--grid-line) 79px, var(--grid-line) 80px
    );
    /* background-position-x set inline to align lines with week header boundaries */
  }

  .row-cells.painted-month {
    background-color: var(--grid-bg);
  }

  /* Month-view body cells (kept as DOM since month widths are variable). */
  .cell-line {
    height: 100%;
    border-right: 1px solid var(--border);
  }
  .row-cells .cell-line:nth-child(even) { background: var(--alt-bg); }

  /* Blocks */
  .block {
    position: absolute;
    height: calc(100% - 6px);
    top: 3px;
    border-radius: 2px;
    cursor: grab;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 3px;
    padding: 0 10px;
    font-size: 0.85rem;
    font-weight: 500;
    color: inherit;
    user-select: none;
    transition: box-shadow 0.15s, opacity 0.15s;
    overflow: visible;
    z-index: 2;
    font-family: inherit;
  }

  .block:hover {
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  .block.dragging {
    opacity: 0.9;
    cursor: grabbing;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 10;
  }

  .block-start-tooltip {
    position: absolute;
    left: -8px;
    top: 50%;
    transform: translate(-100%, -50%);
    background: rgba(40, 54, 62, 0.96);
    color: #fff;
    border-radius: 6px;
    padding: 0.25rem 0.45rem;
    font-size: 0.72rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    z-index: 20;
  }

  .block-start-tooltip::after {
    content: '';
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
    border-width: 5px 0 5px 5px;
    border-style: solid;
    border-color: transparent transparent transparent rgba(40, 54, 62, 0.96);
  }

  .block .handle-left,
  .block .handle-right {
    position: absolute;
    top: 0;
    width: 8px;
    height: 100%;
    cursor: ew-resize;
    z-index: 4;
  }

  .block .handle-left { left: 0; }
  .block .handle-right { right: 0; }

  .create-preview {
    position: absolute;
    top: 3px;
    height: calc(100% - 6px);
    border: 2px dotted #777;
    border-radius: 2px;
    background: rgba(255,255,255,0.25);
    pointer-events: none;
    z-index: 3;
  }

  .block .block-label {
    flex: 0 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    pointer-events: none;
    min-width: 0;
    max-width: 100%;
    position: relative;
    z-index: 3;
    line-height: 1.2;
  }
  .block .block-days-badge {
    flex: 0 0 auto;
    font-size: 0.7rem;
    font-weight: 500;
    opacity: 0.75;
    pointer-events: none;
    position: relative;
    z-index: 3;
    line-height: 1.2;
  }
  .block.block-compact {
    flex-direction: row;
    justify-content: flex-start;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }
  .block.block-compact .block-label {
    flex: 0 1 auto;
    max-width: calc(100% - 2.5rem);
  }
  .block.block-compact .block-days-badge {
    flex: 0 1 auto;
    min-width: 0;
    max-width: 50%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: left;
  }
  .capacity-adjusted {
    color: #777;
    opacity: 0.75;
  }
  .capacity-block,
  .contingency-capacity-extension {
    position: absolute;
    top: 0;
    height: 100%;
    background: rgba(128,128,128,0.18);
    pointer-events: none;
    z-index: 1;
  }
  .capacity-block {
    height: calc(100% - 6px);
    top: 3px;
    border: 1px dashed #888;
    border-radius: 2px;
    user-select: none;
  }
  .capacity-block::after,
  .contingency-capacity-extension::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 4px,
      rgba(120,120,120,0.22) 4px,
      rgba(120,120,120,0.22) 8px
    );
  }

  .block-contingency .contingency-days {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.75rem;
    font-weight: 500;
    color: #777;
    z-index: 2;
  }
  .block .block-label-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font: inherit;
    color: inherit;
    padding: 0;
    margin: 0;
    user-select: text;
    cursor: text;
  }

  /* Block colours — oranges, browns, greens */
  .block-color-0 { background: #f0f3f5; color: #28363e; } /* air force blue 50 */
  .block-color-1 { background: #e0e7eb; color: #28363e; } /* air force blue 100 */
  .block-color-2 { background: #c1cfd7; color: #28363e; } /* air force blue 200 */
  .block-color-3 { background: #a2b7c3; color: #28363e; } /* air force blue 300 */
  .block-color-4 { background: #849fae; color: #141b1f; } /* air force blue 400 */

const DAY_LARGE_PX = 160;    // px per day in close day view
const DAY_HALF_PX = 320;     // px per day in closest view, split into two half-day columns
const WEEK_DAY_PX = 16;      // px per day in week view — 5 × 16 = 80px per week cell
const MONTH_DAY_PX = 5;      // px per day in month view — typical ~22-day month ≈ 110px wide
const ROW_H = 40;

// Pixels per *day* at the current zoom. Blocks are always day-indexed in the
// data model; this just controls how wide a day renders. In week view each
// visual cell is 5 × WEEK_DAY_PX = 80px wide with no day subdivisions drawn,
// but blocks position + size against day-level pixels underneath.
function dayPx() {
  if (zoom === 'day-large') return DAY_LARGE_PX;
  if (zoom === 'day-half') return DAY_HALF_PX;
  if (zoom === 'week') return WEEK_DAY_PX;
  if (zoom === 'month') return MONTH_DAY_PX;
  return CELL_W;
}
// For week view we use a fixed 5-day stride. Month view has variable month
// widths (handled inline in render via per-month iteration), so daysPerCell
// is only meaningful for day/week.
function isDayLikeZoom() { return zoom === 'day' || zoom === 'day-large' || zoom === 'day-half'; }
function daysPerCell() { return zoom === 'week' ? 5 : 1; }
function cellVisualW() { return dayPx() * daysPerCell(); }

// Dynamic timeline window, inspired by calendar timeline demos: the grid is
// generated from dates relative to "now" rather than a hard-coded project span.
// It covers the current year through two years out, expanded to complete
// Monday–Friday weeks so the first and last week headers are never partial.
// Blocks remain weekday-column indexed within this generated window.
function startOfWorkWeek(d) {
  const out = new Date(d); out.setHours(0,0,0,0);
  out.setDate(out.getDate() - ((out.getDay() + 6) % 7));
  return out;
}
function endOfWorkWeek(d) {
  const out = startOfWorkWeek(d);
  out.setDate(out.getDate() + 4);
  return out;
}
const TIMELINE_BASE_YEAR = new Date().getFullYear();
const PROJECT_START_DATE = startOfWorkWeek(new Date(TIMELINE_BASE_YEAR, 0, 1));
const PROJECT_END_DATE   = endOfWorkWeek(new Date(TIMELINE_BASE_YEAR + 2, 11, 31));
function countWeekdaysInclusive(from, to) {
  const a = new Date(from); a.setHours(0,0,0,0);
  const b = new Date(to);   b.setHours(0,0,0,0);
  let n = 0;
  for (let d = new Date(a); d <= b; d.setDate(d.getDate() + 1)) {
    const wd = d.getDay();
    if (wd !== 0 && wd !== 6) n++;
  }
  return n;
}
const TOTAL_COLS = countWeekdaysInclusive(PROJECT_START_DATE, PROJECT_END_DATE);

// Format: "[base]d + [conting]d ([total]d)" when contingency > 0, else "[base]d".
// The letter 'd' and any contingency amount are wrapped in .cg for styling.
function fmtDays(base, conting) {
  if (conting > 0) {
    const total = base + conting;
    return `${base}<span class="cg">d</span> + <span class="cg">${conting}d</span> (${total}<span class="cg">d</span>)`;
  }
  return `${base}<span class="cg">d</span>`;
}

function toFiniteNumber(value, fallback = 0) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function toPositiveInt(value, fallback = 1) {
  return Math.max(1, Math.round(toFiniteNumber(value, fallback)));
}

function toNonNegativeInt(value, fallback = 0) {
  return Math.max(0, Math.round(toFiniteNumber(value, fallback)));
}

function sanitizeState(data) {
  if (!data || typeof data !== 'object') return null;
  if (!Array.isArray(data.rows) || !Array.isArray(data.blocks)) return null;

  const validZooms = new Set(MAP_ZOOM_LEVELS.map(level => typeof level === 'string' ? level : level.key).concat('table'));
  const cleanRows = data.rows
    .filter(row => row && typeof row === 'object' && Number.isFinite(Number(row.id)))
    .map(row => {
      const rowId = toPositiveInt(row.id);
      const tracks = Array.isArray(row.tracks) && row.tracks.length
        ? row.tracks.slice(0, MAX_TRACKS_PER_ROW)
          .filter(track => track && typeof track === 'object')
          .map((track, idx) => ({
            id: typeof track.id === 'string' && track.id ? track.id : `r${rowId}-t${idx + 1}`,
            label: typeof track.label === 'string' ? track.label : (idx === 0 ? 'Main' : `Track ${idx + 1}`),
            height: Math.max(ROW_H_MIN, Math.min(ROW_H_MAX, toPositiveInt(track.height || row.height, ROW_H_DEFAULT))),
          }))
        : [{ id: `r${rowId}-t1`, label: 'Main', height: Math.max(ROW_H_MIN, Math.min(ROW_H_MAX, toPositiveInt((data.rowHeights && data.rowHeights[rowId]) || row.height, ROW_H_DEFAULT))) }];
      return {
        ...row,
        id: rowId,
        label: clampResourceName(row.label),
        height: toNonNegativeInt(row.height, 0),
        capacity: Math.max(1, Math.min(999, toPositiveInt(row.capacity, 100))),
        tags: Array.isArray(row.tags)
          ? row.tags.filter(tag => typeof tag === 'string').map(tag => tag.trim()).filter(Boolean).slice(0, 50)
          : [],
        tracks,
      };
    });

  const rowIds = new Set(cleanRows.map(row => row.id));
  const firstTrackByRow = new Map(cleanRows.map(row => [row.id, row.tracks[0].id]));
  const cleanBlocks = data.blocks
    .filter(block => block && typeof block === 'object' && Number.isFinite(Number(block.id)))
    .map(block => ({
      ...block,
      id: toPositiveInt(block.id),
      rowId: toPositiveInt(block.rowId),
      trackId: typeof block.trackId === 'string' ? block.trackId : firstTrackByRow.get(toPositiveInt(block.rowId)),
      start: toNonNegativeInt(block.start, 0),
      baseDuration: toPositiveInt(block.baseDuration || block.duration, 1),
      duration: toPositiveInt(block.duration || block.baseDuration, 1),
      label: typeof block.label === 'string' ? block.label : '',
      kind: block.kind === 'data' ? 'data' : 'grid',
      color: ((toNonNegativeInt(block.color, 0) % COLORS) + COLORS) % COLORS,
      locked: !!block.locked,
    }))
    .filter(block => rowIds.size === 0 || rowIds.has(block.rowId));

  return {
    ...data,
    version: toPositiveInt(data.version, STATE_VERSION),
    rows: cleanRows,
    blocks: cleanBlocks,
    rowHeights: data.rowHeights && typeof data.rowHeights === 'object' ? data.rowHeights : {},
    nextBlockId: toPositiveInt(data.nextBlockId, cleanBlocks.reduce((m, b) => Math.max(m, b.id), 0) + 1),
    nextRowId: toPositiveInt(data.nextRowId, cleanRows.reduce((m, r) => Math.max(m, r.id), 0) + 1),
    contingencyPct: Math.max(0, Math.min(100, toNonNegativeInt(data.contingencyPct, 0))),
    zoom: validZooms.has(data.zoom) ? data.zoom : 'day',
    panelWidth: Math.max(200, Math.min(800, toPositiveInt(data.panelWidth, 280))),
    headerWidth: Math.max(HEADER_W_MIN, Math.min(HEADER_W_MAX, toPositiveInt(data.headerWidth, ROW_HEADER_W))),
    resourceSummaryWidth: Math.max(SUMMARY_W_MIN, Math.min(SUMMARY_W_MAX, toPositiveInt(data.resourceSummaryWidth, RESOURCE_SUMMARY_W))),
    collapsedRows: data.collapsedRows && typeof data.collapsedRows === 'object' ? data.collapsedRows : {},
  };
}

function snapshotState() {
  const now = Date.now();
  return {
    version: STATE_VERSION,
    rows, blocks, rowHeights, nextBlockId, nextRowId,
    contingencyPct, zoom, panelWidth, headerWidth, resourceSummaryWidth, collapsedRows,
    projectStart: projectStart.toISOString(),
    savedAt: now,
    updatedAt: now,
    updatedBy: _currentUser ? { uid: _currentUser.uid, email: _currentUser.email } : null,
  };
}

function firestoreSnapshot(snapshot) {
  return {
    ...snapshot,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  };
}

async function writeBackup(snapshot, reason = 'auto') {
  if (!_db || !_currentUser) return;
  const now = Date.now();
  if (reason === 'auto' && now - _lastBackupAt < AUTO_BACKUP_MIN_INTERVAL_MS) return;
  _lastBackupAt = now;
  try {
    await _db.collection(BACKUPS_PATH).doc(String(now)).set({
      ...snapshot,
      backupReason: reason,
      backupCreatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  } catch (e) {
    console.warn('Firestore backup failed:', e);
  }
}

function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}

// Load from Firestore first, fall back to IndexedDB
async function loadState() {
  // Try Firestore
  if (_db) {
    try {
      const snap = await _db.doc(DOC_PATH).get();
      if (snap.exists) {
        console.log('State loaded from Firestore');
        return sanitizeState(snap.data());
      }
    } catch (e) {
      console.warn('Firestore load failed, falling back to IndexedDB:', e);
    }
  }
  // IndexedDB fallback
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const req = db.transaction(STORE, 'readonly').objectStore(STORE).get(STATE_KEY);
      req.onsuccess = () => resolve(sanitizeState(req.result) || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    console.warn('IndexedDB loadState failed:', e);
    return null;
  }
}

// Debounced save — Firestore primary + IndexedDB local fallback
let _saveTimer = null;
let _saveReady = false;
let _hasPendingLocalSave = false;
function saveState() {
  if (!_saveReady) return;
  _hasPendingLocalSave = true;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    _saveTimer = null;
    const snapshot = snapshotState();
    const remoteSnapshot = _db && _currentUser ? firestoreSnapshot(snapshot) : snapshot;

    // Firestore — ignore failure (offline etc.), fallback persists locally
    if (_db && _currentUser) {
      try {
        setSyncStatus('saving', 'Saving');
        await writeBackup(remoteSnapshot, 'auto');
        await _db.doc(DOC_PATH).set({ ...remoteSnapshot, _clientId: CLIENT_ID }, { merge: false });
        setSyncStatus('saved', 'Saved');
      } catch (e) {
        setSyncStatus('error', 'Save failed');
        console.warn('Firestore save failed:', e);
      }
    }

    // IndexedDB local backup. Use the plain snapshot, not Firestore sentinels.
    try {
      const db = await openDB();
      db.transaction(STORE, 'readwrite').objectStore(STORE).put(snapshot, STATE_KEY);
    } catch (e) {
      console.warn('IndexedDB saveState failed:', e);
    } finally {
      _hasPendingLocalSave = false;
    }
  }, 200);
}

// Listen for remote state changes and apply them
function listenForChanges() {
  if (!_db) return;
  _unsub = _db.doc(DOC_PATH).onSnapshot((snap) => {
    const data = snap.data();
    if (!data) return;
    // Ignore our own writes (echo prevention)
    if (data._clientId === CLIENT_ID) return;
    const remote = sanitizeState({ ...data });
    if (!remote) return;
    if (_hasPendingLocalSave || _saveTimer) {
      setSyncStatus('saving', 'Local changes kept');
      return;
    }
    delete remote._clientId;
    setSyncStatus('saving', 'Syncing');
    applyRemoteState(remote);
    setSyncStatus('saved', 'Synced');
  }, (err) => {
    console.warn('Firestore listener error:', err);
  });
}

// Apply state received from Firestore remote write
function applyRemoteState(data) {
  if (!data || typeof data !== 'object') return;
  if (data.rows)     { rows           = data.rows; }
  if (data.blocks)   { blocks         = data.blocks; }
  if (data.nextBlockId != null) nextBlockId = data.nextBlockId;
  if (data.nextRowId != null)   nextRowId   = data.nextRowId;
  if (data.contingencyPct != null) contingencyPct = data.contingencyPct;
  if (data.collapsedRows) collapsedRows = data.collapsedRows;
  if (data.zoom)     zoom = data.zoom;
  if (typeof data.panelWidth === 'number') panelWidth = data.panelWidth;
  if (typeof data.resourceSummaryWidth === 'number') resourceSummaryWidth = data.resourceSummaryWidth;
  if (typeof data.headerWidth === 'number') { headerWidth = data.headerWidth; applyHeaderWidth(); }
  if (data.rowHeights) rowHeights = data.rowHeights;
  // Track heights are authoritative on row.tracks (seeded from legacy rowHeights
  // during sanitizeState). Do NOT re-apply the stale rowHeights map here — it
  // never updates on resize and would reset every just-resized row.
  normalizeRows();
  normalizeBlocks();

  // Sync UI
  const contingencyInput = document.getElementById('contingency');
  if (contingencyInput) contingencyInput.value = contingencyPct;
  syncViewButtons();

  // Re-render without writing the just-received state back to Firestore.
  _skipSaveOnNextPostRender = true;
  _renderScheduled = false;
  render();
  renderPanel();
}

function makeTrack(rowId, index = 0) {
  return { id: `r${rowId}-t${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`, label: index === 0 ? 'Main' : `Track ${index + 1}`, height: ROW_H_DEFAULT };
}
function makeDefaultTrack(rowId) { return { id: `r${rowId}-t1`, label: 'Main', height: ROW_H_DEFAULT }; }
function clampResourceName(value) { return (typeof value === 'string' ? value : '').slice(0, RESOURCE_NAME_MAX_CHARS); }
function makeRow(id) { return { id, label: '', height: 0, capacity: 100, tags: [], tracks: [makeDefaultTrack(id)] }; }
function getRowTracks(row) {
  if (!row) return [];
  if (!Array.isArray(row.tracks) || !row.tracks.length) row.tracks = [makeDefaultTrack(row.id)];
  row.tracks = row.tracks.slice(0, MAX_TRACKS_PER_ROW).map((track, idx) => ({
    id: typeof track.id === 'string' && track.id ? track.id : `r${row.id}-t${idx + 1}`,
    label: typeof track.label === 'string' ? track.label : (idx === 0 ? 'Main' : `Track ${idx + 1}`),
    height: Math.max(ROW_H_MIN, Math.min(ROW_H_MAX, Math.round(Number(track.height) || ROW_H_DEFAULT))),
  }));
  return row.tracks;
}
function getDefaultTrackId(row) { return getRowTracks(row)[0]?.id || null; }
function getTrack(row, trackId) { return getRowTracks(row).find(track => track.id === trackId) || getRowTracks(row)[0]; }
function canAddTrack(row) { return getRowTracks(row).length < MAX_TRACKS_PER_ROW; }
function getAddRowH(row) { return canAddTrack(row) ? ADD_TRACK_ROW_H : 0; }
function getResourceGroupHeight(row) {
  const sum = getRowTracks(row).reduce((s, t) => s + (t.height || ROW_H_DEFAULT), 0);
  return Math.max(RESOURCE_HEADER_MIN_H, sum + getAddRowH(row));
}
function getRowCapacity(row) {

  return Number.isFinite(cap) && cap > 0 ? cap : 100;
}
function normalizeRows() {

    if (!Array.isArray(row.tags)) row.tags = [];

}

// --- Date helpers ---
// Project timeline is generated dynamically (see PROJECT_START_DATE / PROJECT_END_DATE).
const projectStart = new Date(PROJECT_START_DATE);
projectStart.setHours(0,0,0,0);

// Returns the weekday-col index for today, or -1 if today isn't on the grid
// (weekend or outside [projectStart, projectEnd]).
// Returns the nearest weekday-col index for today.
// If today is itself a weekday, that's returned.
// If today is a weekend, the nearest past Friday is used as the visual stand-in.
function todayWeekdayCol() {
  const t = new Date(); t.setHours(0,0,0,0);
  let wd = t.getDay();
  // If weekend, snap back to Friday ( Sat→-1, Sun→-2 )
  if (wd === 0) wd = -2; // Sunday → Friday
  else if (wd === 6) wd = -1; // Saturday → Friday
  const tAdj = new Date(t);
  tAdj.setDate(tAdj.getDate() + wd);
  if (tAdj < projectStart || tAdj > PROJECT_END_DATE) return -1;
  let n = 0;
  const d = new Date(projectStart);
  while (d <= tAdj) {
    const day = d.getDay();
    if (day !== 0 && day !== 6) n++;
    d.setDate(d.getDate() + 1);
  }
  return n - 1;
}

// Grid is weekday-only: col 0 = projectStart (always a Monday), col 1 = next
// weekday, weekends never get a column. `colToDate` advances one weekday at a time.
function colToDate(col) {
  const d = new Date(projectStart);
  let added = 0;
  while (added < col) {
    d.setDate(d.getDate() + 1);
    const day = d.getDay();
    if (day !== 0 && day !== 6) added++;
  }
  return d;
}

function formatDate(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d.getDate()} ${months[d.getMonth()]}`;
}

function formatDateFull(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}

function toDateInputValue(d) {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function dateInputToCol(value) {
  const d = new Date(value + 'T00:00:00');
  if (Number.isNaN(d.getTime())) return 0;
  d.setHours(0,0,0,0);
  // Snap weekends forward to Monday.
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  if (d < projectStart) return 0;
  let col = 0;
  const cursor = new Date(projectStart);
  while (cursor < d && col < TOTAL_COLS - 1) {
    cursor.setDate(cursor.getDate() + 1);
    const day = cursor.getDay();
    if (day !== 0 && day !== 6) col++;
  }
  return Math.max(0, Math.min(TOTAL_COLS - 1, col));
}

// rAF-batched render: multiple synchronous render() calls collapse into a
// single actual render in the next animation frame.
let _renderScheduled = false;
let _postRenderTimer = null;
let _skipSaveOnNextPostRender = false;
function render() {
  if (_renderScheduled) return;
  _renderScheduled = true;

    _renderScheduled = false;

function schedulePostRenderWork() {
  if (_postRenderTimer) clearTimeout(_postRenderTimer);
  // Keep expensive non-visual work out of the interaction frame. This avoids
  // grid-wrapper clicks/drags being charged with Sortable setup + panel render.
  _postRenderTimer = setTimeout(() => {

    // straight back to Firestore — otherwise two open clients ping-pong saves
