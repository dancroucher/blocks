    gridHandle.className = 'row-drag-handle';
    gridHandle.textContent = '⠿';
    gridHandle.title = 'Drag to reorder';
    gridHandle.addEventListener('mousedown', (e) => startRowDrag(e, row.id, 'grid'));
    header.appendChild(gridHandle);

    const input = document.createElement('input');
    input.className = 'row-label-input';
    input.placeholder = 'Resource ' + row.id;
    input.value = row.label;
    input.oninput = (e) => { row.label = e.target.value; renderPanel(); saveState(); };
    header.appendChild(input);

    const capacityWrap = document.createElement('span');
    capacityWrap.className = 'capacity-control';
    capacityWrap.title = 'Row capacity: lower capacity makes blocks longer (e.g. 50% doubles duration)';
    const capacityInput = document.createElement('input');
    capacityInput.type = 'number';
    capacityInput.className = 'capacity-input';
    capacityInput.min = '1';
    capacityInput.max = '999';
    capacityInput.value = getRowCapacity(row);
    capacityInput.addEventListener('mousedown', e => e.stopPropagation());
    capacityInput.addEventListener('click', e => e.stopPropagation());
    capacityInput.addEventListener('change', (e) => setRowCapacity(row, e.target.value));
    capacityWrap.appendChild(capacityInput);
    capacityWrap.appendChild(document.createTextNode('%'));
    header.appendChild(capacityWrap);

    const deleteResourceBtn = document.createElement('button');
    deleteResourceBtn.className = 'resource-delete-btn';
    deleteResourceBtn.type = 'button';
    deleteResourceBtn.title = 'Delete resource';
    deleteResourceBtn.textContent = '×';
    deleteResourceBtn.addEventListener('mousedown', e => e.stopPropagation());
    deleteResourceBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteResource(row.id); });
    header.appendChild(deleteResourceBtn);
    rowEl.appendChild(header);

    // Cells
    const cells = document.createElement('div');
    cells.className = 'row-cells';
    cells.dataset.rowId = row.id;

    // Body cells.
    // Day/week views: paint the grid via CSS gradient on .row-cells (no DOM
    // nodes per cell). Month view keeps real DOM nodes since month widths
    // vary and don't tile cleanly.
    if (zoom === 'month') {
      cells.classList.add('painted-month');
      let mc = 0;
      while (mc < TOTAL_COLS) {
        const d0 = colToDate(mc);
        const m = d0.getMonth();
        const y = d0.getFullYear();
        let span = 0;
        let hasToday = false;
        while (mc + span < TOTAL_COLS) {
          const d2 = colToDate(mc + span);
          if (d2.getMonth() !== m || d2.getFullYear() !== y) break;
          if (isToday(d2)) hasToday = true;
          span++;
        }
        const w = span * dayPx();
        const line = document.createElement('div');
        line.className = 'cell-line';
        if (hasToday) line.classList.add('today');
        line.style.width = w + 'px';
        line.style.minWidth = w + 'px';
        cells.appendChild(line);
        mc += span;
      }
    } else {
      cells.classList.add(zoom === 'week' ? 'painted-week' : 'painted-day');
      // Set explicit width since there are no child cells driving size
      cells.style.width = (TOTAL_COLS * dayPx()) + 'px';
      cells.style.minWidth = (TOTAL_COLS * dayPx()) + 'px';
      // Align week gradient lines with week header boundaries.
      // The first week may be a partial week (project might not start on Monday),
      // so offset the repeating gradient by the first week's pixel width.
      if (zoom === 'week') {
        let firstWeekDays = 0;
        for (let wc = 0; wc < TOTAL_COLS; wc++) {
          if (wc > 0 && colToDate(wc).getDay() === 1) break;
          firstWeekDays++;
        }
        // Gradient line (left edge) is at 79px within each 80px tile.
        // Shift origin so first line falls at firstWeekDays * WEEK_DAY_PX.
        cells.style.backgroundPositionX = (firstWeekDays * WEEK_DAY_PX - 79) + 'px';
      }
      // Today overlay (single absolute div) — covers today's day column
      const todayCol = todayWeekdayCol();
      if (todayCol !== -1) {
        const ov = document.createElement('div');
        ov.className = 'today-overlay';
        ov.style.left = (todayCol * dayPx()) + 'px';
        ov.style.width = dayPx() + 'px';
        cells.appendChild(ov);
      }
    }

    // Render blocks for this row
    const rowBlocks = blocks.filter(b => b.rowId === row.id);
    rowBlocks.forEach(block => {
      const bEl = document.createElement('div');
      bEl.className = `block block-color-${block.color}${isDataBlock(block) ? ' block-data' : ''}`;
      const baseDuration = getBlockBaseDuration(block);
      const capacityDays = Math.max(0, block.duration - baseDuration);
      bEl.style.left = (block.start * dayPx()) + 'px';
      bEl.style.width = (baseDuration * dayPx() - 2) + 'px';
      bEl.dataset.blockId = block.id;

      // Editable label
      const labelEl = document.createElement('span');
      labelEl.className = 'block-label';
      labelEl.textContent = block.label || '';
      bEl.appendChild(labelEl);

      // Right-aligned day count badge: base days, then capacity-adjusted schedule in brackets
      const daysBadge = document.createElement('span');
      daysBadge.className = 'block-days-badge';
      daysBadge.innerHTML = fmtBlockDuration(block);
      bEl.appendChild(daysBadge);

      if (!isDataBlock(block)) {
        // Resize handles
        const hl = document.createElement('div');
        hl.className = 'handle-left';
        hl.addEventListener('mousedown', (e) => startResize(e, block.id, 'left'));
        bEl.appendChild(hl);

        const hr = document.createElement('div');
        hr.className = 'handle-right';
        hr.addEventListener('mousedown', (e) => startResize(e, block.id, 'right'));
        bEl.appendChild(hr);

        // Move
        bEl.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('handle-left') || e.target.classList.contains('handle-right')) return;
          if (e.target.classList.contains('block-label-input')) return;
          startMove(e, block.id);
        });
      }

      // Context menu
      bEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (isDataBlock(block)) return;
        showBlockContextMenu(e, block.id);
      });

      // Click-timing double-click detection — more reliable than native dblclick
      // (which can be lost when render() rebuilds DOM between clicks).
      bEl.addEventListener('click', (e) => {
        if (isDataBlock(block)) return;
        if (e.target.classList.contains('handle-left') || e.target.classList.contains('handle-right')) return;
        if (e.target.classList.contains('block-label-input')) return;
        const now = Date.now();
        if (now - (block._lastClickAt || 0) < 400) {
          e.stopPropagation();
          block._lastClickAt = 0;
          startEditingBlockLabel(bEl, labelEl, block);
        } else {
          block._lastClickAt = now;
        }
      });

      cells.appendChild(bEl);

      // Capacity block — separate locked segment immediately after the original block.
      if (capacityDays > 0) {
        const capEl = document.createElement('div');
        capEl.className = 'capacity-block';
        capEl.dataset.capacityFor = block.id;
        capEl.style.left = ((block.start + baseDuration) * dayPx()) + 'px';
        capEl.style.width = (capacityDays * dayPx() - 2) + 'px';
        cells.appendChild(capEl);
      }

      // Contingency extension — appended inside bEl so it is anchored to the block start
      if (contingencyPct > 0) {
        const extraDays = Math.round(block.duration * contingencyPct / 100);
        const baseExtraDays = Math.round(getBlockBaseDuration(block) * contingencyPct / 100);
        if (extraDays > 0) {
          const cEl = document.createElement('div');
          cEl.className = `block-contingency block-color-${block.color}`;
          cEl.dataset.contingencyFor = block.id;
          // Positioned relative to the block: starts at the block's right edge
          cEl.style.left = (block.duration * dayPx() - 2) + 'px';
          cEl.style.width = (extraDays * dayPx()) + 'px';
          if (extraDays > baseExtraDays) {
            const capContEl = document.createElement('div');
            capContEl.className = 'contingency-capacity-extension';
            capContEl.style.left = (baseExtraDays * dayPx()) + 'px';
            capContEl.style.width = ((extraDays - baseExtraDays) * dayPx()) + 'px';
            cEl.appendChild(capContEl);
          }
          bEl.appendChild(cEl);
        }
      }
    });

    // Double click on empty space to create block
    cells.addEventListener('dblclick', (e) => {
      if (e.target.closest('.block')) return;
      const rect = cells.getBoundingClientRect();
      const x = e.clientX - rect.left + cells.scrollLeft;
      const col = Math.floor(x / dayPx());
      createBlock(row.id, col, 3);
    });

    // Mousedown to start creating
    cells.addEventListener('mousedown', (e) => {
      if (e.target.closest('.block')) return;
      if (e.button !== 0) return;
      const rect = cells.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const col = Math.floor(x / dayPx());
      const preview = document.createElement('div');
      preview.className = 'create-preview';
      preview.style.left = (col * dayPx()) + 'px';
      preview.style.width = dayPx() + 'px';
      cells.appendChild(preview);
      createState = { rowId: row.id, startCol: col, currentCol: col, preview };
    });

    rowEl.appendChild(cells);
    wrapper.appendChild(rowEl);
  });

  // Add row button — structured as a row so the left label stays sticky with other headers
  const addRowWrapper = document.createElement('div');
  addRowWrapper.className = 'row';
  addRowWrapper.style.height = '32px';

  const addRowHeader = document.createElement('div');
  addRowHeader.className = 'row-header add-row-btn';
  addRowHeader.textContent = '+ Add row';
  addRowHeader.onclick = () => {
    rows.push(makeRow(nextRowId++));
    render();
  };
  addRowWrapper.appendChild(addRowHeader);

  const addRowCells = document.createElement('div');
  addRowCells.style.flex = '1';
  addRowCells.style.height = '32px';
  if (zoom !== 'month') {
    addRowCells.style.width = (TOTAL_COLS * dayPx()) + 'px';
    addRowCells.style.minWidth = (TOTAL_COLS * dayPx()) + 'px';
  }
  addRowWrapper.appendChild(addRowCells);

  wrapper.appendChild(addRowWrapper);

  renderPanel();
  saveState();
}

// --- Panel inline editing ---
function startEditingPanelRowLabel(labelSpan, row) {
  if (labelSpan.querySelector('input')) return;
  const prev = row.label;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'panel-name-input';
  input.value = row.label;
  input.placeholder = 'Row ' + row.id;
  input.addEventListener('mousedown', e => e.stopPropagation());
  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('dblclick', e => e.stopPropagation());
  labelSpan.textContent = '';
  labelSpan.appendChild(input);
  requestAnimationFrame(() => { input.focus(); input.select(); });

  let done = false;
  const finish = (commit) => {
    if (done) return;
    done = true;
    if (commit) row.label = input.value.trim();
    labelSpan.textContent = row.label || 'Row ' + row.id;
    if (commit && row.label !== prev) {
      saveState();
      // Sync grid row header input
      const gridInput = document.querySelector(`.row[data-row-id="${row.id}"] .row-header .row-label-input`);
      if (gridInput) gridInput.value = row.label;
    }
  };
  input.addEventListener('blur', () => finish(true));
  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
}

function startEditingPanelBlockLabel(nameSpan, block) {
  if (nameSpan.querySelector('input')) return;
  const prev = block.label;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'panel-name-input';
  input.value = block.label || '';
  input.placeholder = 'Untitled';
  input.addEventListener('mousedown', e => e.stopPropagation());
  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('dblclick', e => e.stopPropagation());
  nameSpan.textContent = '';
  nameSpan.appendChild(input);
  requestAnimationFrame(() => { input.focus(); input.select(); });

  let done = false;
  const finish = (commit) => {
    if (done) return;
    done = true;
    if (commit) block.label = input.value.trim();
    nameSpan.textContent = block.label || 'Untitled';
    if (commit && block.label !== prev) {
      saveState();
      // Sync grid block label without full re-render
      const gridLabel = document.querySelector(`[data-block-id="${block.id}"] .block-label`);
      if (gridLabel) gridLabel.textContent = block.label;
    }
  };
  input.addEventListener('blur', () => finish(true));
  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
}

function renderPanel() {
  const stats = document.getElementById('panel-stats');
  const list = document.getElementById('panel-blocks');
  if (!stats) return;
  const totalBlocks = blocks.length;
  const rowsUsed = new Set(blocks.map(b => b.rowId)).size;

  const totalDays = blocks.reduce((s, b) => s + getBlockBaseDuration(b), 0);
  const scheduledDays = blocks.reduce((s, b) => s + b.duration, 0);
  const contingencyDays = contingencyPct > 0 ? blocks.reduce((s, b) => s + Math.round(b.duration * contingencyPct / 100), 0) : 0;
  const scheduledLine = scheduledDays !== totalDays
    ? `<div class="panel-stat"><span class="label">Capacity-adjusted Days</span><span class="value capacity-adjusted">${scheduledDays}d</span></div>`
    : '';

  stats.innerHTML = `
    <div class="panel-stat"><span class="label">Base Days</span><span class="value" style="color:var(--text)">${totalDays}<span class="cg">d</span></span></div>
    ${scheduledLine}
    <div class="panel-stat"><span class="label">Contingency Days @ ${contingencyPct}%</span><span class="value" style="color:var(--text)">+${contingencyDays}d</span></div>
    <div class="panel-stat"><span class="label">Total Days</span><span class="value" style="color:var(--text)">${fmtDays(scheduledDays, contingencyDays)}</span></div>
    <div class="panel-stat"><span class="label">Active Rows</span><span class="value">${rowsUsed}</span></div>
    <div class="panel-stat"><span class="label">Total Blocks</span><span class="value">${totalBlocks}</span></div>
  `;

  if (!list) return;
  list.innerHTML = '';

  // Group blocks by row
  rows.forEach(row => {
    const rowBlocks = blocks.filter(b => b.rowId === row.id);
    if (rowBlocks.length === 0) return;

    const rowDays = rowBlocks.reduce((s, b) => s + getBlockBaseDuration(b), 0);
    const rowScheduledDays = rowBlocks.reduce((s, b) => s + b.duration, 0);
    const rowContingency = contingencyPct > 0 ? rowBlocks.reduce((s, b) => s + Math.round(b.duration * contingencyPct / 100), 0) : 0;

    // Section header (collapsible)
    const isCollapsed = !!collapsedRows[row.id];
    const section = document.createElement('div');
    section.className = 'panel-section-header' + (isCollapsed ? ' collapsed' : '');
    section.dataset.rowId = row.id;

    const panelHandle = document.createElement('div');
    panelHandle.className = 'row-drag-handle';
    panelHandle.textContent = '⠿';
    panelHandle.title = 'Drag to reorder';
    panelHandle.addEventListener('mousedown', (e) => startRowDrag(e, row.id, 'panel'));
    section.appendChild(panelHandle);

    const sectionTitle = document.createElement('span');
    sectionTitle.className = 'section-title';

    const caret = document.createElement('span');
    caret.className = 'caret';
    caret.textContent = '▼';
    sectionTitle.appendChild(caret);

    const rowLabelSpan = document.createElement('span');
    rowLabelSpan.className = 'panel-row-label';
    rowLabelSpan.textContent = row.label || 'Row ' + row.id;
    rowLabelSpan.title = 'Double-click to rename';
    rowLabelSpan.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      startEditingPanelRowLabel(rowLabelSpan, row);
    });
    sectionTitle.appendChild(rowLabelSpan);

    const sectionDays = document.createElement('span');
    sectionDays.className = 'section-days-3col';
    const totalRowDays = rowScheduledDays + rowContingency;
    sectionDays.innerHTML = `<span class="sec-base">${getRowCapacity(row)}% · ${rowDays}d${rowScheduledDays !== rowDays ? ` <span class="capacity-adjusted">(${rowScheduledDays}d)</span>` : ''}</span><span class="sec-conting">+${rowContingency}d</span><span class="sec-total">${totalRowDays}d</span>`;

    section.appendChild(sectionTitle);
    section.appendChild(sectionDays);

    section.addEventListener('click', (e) => {
      if (e.target.closest('.panel-row-label') || e.target.tagName === 'INPUT') return;
      if (e.target.closest('.row-drag-handle')) return;
      if (collapsedRows[row.id]) delete collapsedRows[row.id];
      else collapsedRows[row.id] = true;
      renderPanel();
      saveState();
    });
    list.appendChild(section);

    // Body container for this row's blocks
    const body = document.createElement('div');
    body.className = 'panel-section-body' + (isCollapsed ? ' collapsed' : '');
    list.appendChild(body);

    // Blocks in this row
    rowBlocks.forEach(block => {
      const startDate = formatDate(colToDate(block.start));
      const endDate = formatDate(colToDate(block.start + block.duration - 1));

      const extraDays = contingencyPct > 0 ? Math.round(block.duration * contingencyPct / 100) : 0;

      const item = document.createElement('div');
      item.className = 'panel-block-item';

      const nameRow = document.createElement('div');
      nameRow.className = 'block-name';

      const dot = document.createElement('span');
      dot.className = `block-dot block-color-${block.color}`;

      const nameSpan = document.createElement('span');
      nameSpan.className = 'panel-block-name-text';
      nameSpan.textContent = block.label || 'Untitled';
      nameSpan.title = 'Double-click to rename';
      nameSpan.style.flex = '1';
      nameSpan.style.minWidth = '0';
      nameSpan.style.overflow = 'hidden';
      nameSpan.style.textOverflow = 'ellipsis';
      nameSpan.style.whiteSpace = 'nowrap';
      nameSpan.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        startEditingPanelBlockLabel(nameSpan, block);
      });

      const daysSpan = document.createElement('span');
      daysSpan.className = 'block-days';
      daysSpan.innerHTML = fmtBlockDuration(block);

      nameRow.appendChild(dot);
      nameRow.appendChild(nameSpan);
      nameRow.appendChild(daysSpan);

      const metaDiv = document.createElement('div');
      metaDiv.className = 'block-meta';
      metaDiv.textContent = `${startDate} → ${endDate}`;

      item.appendChild(nameRow);
      item.appendChild(metaDiv);

      item.addEventListener('click', (e) => {
        if (e.target.tagName === 'INPUT') return;
        const gridArea = document.getElementById('grid-area');
        gridArea.scrollLeft = block.start * dayPx() - 200;
      });
      body.appendChild(item);
    });

    // Row totals bar
    const totals = document.createElement('div');
    totals.className = 'section-totals';
    totals.innerHTML = `
      <span class="totals-label">Total</span>
      <span class="totals-col totals-base">${rowDays}d</span>
      <span class="totals-col totals-conting">+${rowContingency}d</span>
      <span class="totals-col totals-total">${totalRowDays}d</span>
    `;
    body.appendChild(totals);
  });
}

// --- Row vertical resize ---
let _rowResize = null; // { rowId, startY, startH }

function startRowResize(e, rowId) {
  e.preventDefault();
  e.stopPropagation();
  const row = rows.find(r => r.id === rowId);
  const startH = rowHeights[rowId] || (row && row.height) || ROW_H_DEFAULT;
  _rowResize = { rowId, startY: e.clientY, startH };
  document.addEventListener('mousemove', onRowResizeMove);
  document.addEventListener('mouseup', endRowResize);
  document.body.style.cursor = 'row-resize';
  document.body.style.userSelect = 'none';
}

function onRowResizeMove(e) {
  if (!_rowResize) return;
  const { rowId, startY, startH } = _rowResize;
  const dy = e.clientY - startY;
  const newH = Math.max(ROW_H_MIN, Math.min(ROW_H_MAX, startH + dy));
  rowHeights[rowId] = newH;
  const row = rows.find(r => r.id === rowId);
  if (row) row.height = newH;
  applyRowHeights();
}

function endRowResize() {
  if (!_rowResize) return;
  const rowId = _rowResize.rowId;
  _rowResize = null;
  document.removeEventListener('mousemove', onRowResizeMove);
  document.removeEventListener('mouseup', endRowResize);
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
  saveState();
}

function applyRowHeights() {
  rows.forEach(row => {
    const h = rowHeights[row.id] || row.height || ROW_H_DEFAULT;
    const rowEl = document.querySelector(`.row[data-row-id="${row.id}"]`);
    if (!rowEl) return;
    rowEl.style.setProperty('--row-h', h + 'px');
  });
}

// --- Block operations ---
function createBlock(rowId, startCol, duration, label, durationIsScheduled = false, kind = 'grid') {
  const row = rows.find(r => r.id === rowId);
  const inputDuration = duration || 3;
  const baseDuration = durationIsScheduled ? adjustedDurationForCapacity(inputDuration, getRowCapacity(row), 100) : inputDuration;
  const scheduledDuration = adjustedDurationForCapacity(baseDuration, 100, getRowCapacity(row));
  const block = {
    id: nextBlockId++,
    rowId,
    start: startCol,
    baseDuration,
    duration: scheduledDuration,
    label: label || '',
    kind: kind === 'data' ? 'data' : 'grid',
    color: (nextBlockId - 2) % COLORS,
  };
  blocks.push(block);
  render();
  return block;
}

function deleteBlock(id) {
  blocks = blocks.filter(b => b.id !== id);
  render();
}

function deleteResource(rowId) {
  const row = rows.find(r => r.id === rowId);
  if (!row) return;
  const resourceName = row.label || `Resource ${row.id}`;
  const blockCount = blocks.filter(b => b.rowId === rowId).length;
  const detail = blockCount ? ` This will also delete ${blockCount} block${blockCount === 1 ? '' : 's'} assigned to it.` : '';
  if (!confirm(`Delete resource "${resourceName}"?${detail}`)) return;
  rows = rows.filter(r => r.id !== rowId);
  blocks = blocks.filter(b => b.rowId !== rowId);
  delete rowHeights[rowId];
  delete collapsedRows[rowId];
  if (!rows.length) rows.push(makeRow(nextRowId++));
  render();
  renderPanel();
  saveState();
}

// --- Inline block label edit (real <input> swap, autosaves on commit) ---
function startEditingBlockLabel(bEl, labelEl, block) {
  // Already editing? bail.
  if (bEl.querySelector('.block-label-input')) return;

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'block-label-input';
  input.value = block.label || '';
  // Stop drag/dblclick handlers from interfering with the input
  input.addEventListener('mousedown', (e) => e.stopPropagation());
  input.addEventListener('dblclick', (e) => e.stopPropagation());
  input.addEventListener('click', (e) => e.stopPropagation());

  labelEl.style.display = 'none';
  bEl.insertBefore(input, labelEl);

  // Defer focus to next frame so the dblclick selection / drag preventDefault
  // doesn't steal it back.
  requestAnimationFrame(() => {
    input.focus();
    input.select();
  });

  let done = false;
  const finish = (commit) => {
    if (done) return;
    done = true;
    if (commit) {
      const next = input.value.trim();
      if (next !== (block.label || '')) {
        block.label = next;
        saveState();
      }
      labelEl.textContent = block.label || '';
      renderPanel();
    }
    if (input.parentNode) input.parentNode.removeChild(input);
    labelEl.style.display = '';
  };

  input.addEventListener('blur', () => finish(true));
  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
}

// --- Row drag-to-reorder ---
function startRowResize(e, rowId) {
  e.preventDefault();
  e.stopPropagation();
  const row = rows.find(r => r.id === rowId);
  if (!row) return;
  const rowEl = document.querySelector(`.row[data-row-id="${rowId}"]`);
  if (!rowEl) return;

  const startY = e.clientY;
  const startH = rowEl.getBoundingClientRect().height;
  const isDefault = !row.height;
  const defaultH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell-size'));

  rowEl.classList.add('resizing');
  document.body.classList.add('row-resizing');

  function onMove(me) {
    const dy = me.clientY - startY;
    let newH = Math.max(30, startH + dy);
    rowEl.style.height = newH + 'px';
  }

  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    rowEl.classList.remove('resizing');
    document.body.classList.remove('row-resizing');

    const finalH = rowEl.getBoundingClientRect().height;
    const defaultH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell-size'));
    // Save as 0 to revert to default, or actual height
    row.height = Math.abs(finalH - defaultH) < 5 ? 0 : Math.round(finalH);
    rowEl.style.height = row.height ? row.height + 'px' : '';
    saveState();
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function startRowDrag(e, rowId, source) {
  e.preventDefault();
  e.stopPropagation();
  const fromIdx = rows.findIndex(r => r.id === rowId);
  if (fromIdx === -1) return;
  const rowEl = document.querySelector(`.row[data-row-id="${rowId}"]`);
  const rowH = rowEl ? (parseInt(rowEl.style.height) || rowEl.getBoundingClientRect().height) : 40;
  // Anchor the row to its exact pickup position in the document
  const rect = rowEl.getBoundingClientRect();
  rowEl.style.position = 'absolute';
  rowEl.style.width = rect.width + 'px';
  rowEl.style.top = rect.top + 'px';
  rowEl.style.left = rect.left + 'px';
  rowEl.style.zIndex = '300';
  rowEl.style.margin = '0';
  rowEl.classList.add('row-dragging');
  requestAnimationFrame(() => rowEl.classList.add('row-lifted'));
  // Create placeholder at end of list (not in-place)
  const wrapper = document.getElementById('grid-wrapper');
  if (wrapper) {
    let ph = wrapper.querySelector('.row-drag-placeholder');
    if (ph) ph.remove();
    ph = document.createElement('div');
    ph.className = 'row row-drag-placeholder';
    ph.style.height = rowH + 'px';
    ph.style.visibility = 'hidden';
    wrapper.appendChild(ph);
    requestAnimationFrame(() => { ph.style.visibility = 'visible'; });
  }
  rowDragState = {
    rowId, fromIdx, insertBefore: null, source,
    startMouseY: e.clientY,
    startElTop: rect.top,
    rowH,
  };
  document.body.classList.add('row-reordering');
  if (rowDragIndicator) rowDragIndicator.style.display = 'block';
}

// --- Drag: Move ---
function startMove(e, blockId) {
  e.preventDefault();
  const block = blocks.find(b => b.id === blockId);
  if (!block || isDataBlock(block)) return;

  dragState = {
    type: 'move',
    blockId,
    startX: e.clientX,
    startY: e.clientY,
    origStart: block.start,
    origRowId: block.rowId,
    moved: false, // becomes true once cursor passes the drag threshold
  };
  // Don't add .dragging or call render() yet — wait until real movement so
  // single clicks (and dblclicks) don't rebuild the DOM and lose element identity.
}

// --- Drag: Resize ---
function startResize(e, blockId, side) {
  e.preventDefault();
  e.stopPropagation();
  const block = blocks.find(b => b.id === blockId);
  if (!block || isDataBlock(block)) return;

  dragState = {
    type: side === 'left' ? 'resize-left' : 'resize-right',
    blockId,
    startX: e.clientX,
    startY: e.clientY,
    origStart: block.start,
    origDuration: block.duration,
    origBaseDuration: getBlockBaseDuration(block),
    origCapacity: getRowCapacity(rows.find(r => r.id === block.rowId)),
    moved: false,
  };
}

const DRAG_THRESHOLD_PX = 4;

document.addEventListener('mousemove', (e) => {
  if (dragState) {
    const block = blocks.find(b => b.id === dragState.blockId);
    if (!block) return;

    const dx = e.clientX - dragState.startX;
    const dy = (e.clientY - (dragState.startY || e.clientY));

    // Suppress drag until the cursor has actually moved past the threshold —
    // otherwise plain clicks rebuild the DOM and break dblclick.
    if (!dragState.moved) {
      if (Math.abs(dx) < DRAG_THRESHOLD_PX && Math.abs(dy) < DRAG_THRESHOLD_PX) return;
      dragState.moved = true;
    }

    const colDelta = Math.round(dx / dayPx());
    const bEl = document.querySelector(`[data-block-id="${dragState.blockId}"]`);
    const cEl = document.querySelector(`[data-contingency-for="${dragState.blockId}"]`);

    const updateContingencyEl = () => {
      if (!cEl) return;
      const extraDays = Math.round(block.duration * contingencyPct / 100);
      const baseExtraDays = Math.round(getBlockBaseDuration(block) * contingencyPct / 100);
      // Positioned relative to the block: starts at block's right edge
      cEl.style.left = (block.duration * dayPx() - 2) + 'px';
      cEl.style.width = (extraDays * dayPx()) + 'px';
      const capContEl = cEl.querySelector('.contingency-capacity-extension');
      if (capContEl) {
        capContEl.style.left = (baseExtraDays * dayPx()) + 'px';
        capContEl.style.width = (Math.max(0, extraDays - baseExtraDays) * dayPx()) + 'px';
      }

    };

    if (dragState.type === 'move') {
      block.start = Math.max(0, dragState.origStart + colDelta);

      // Check if we should move to a different row
      const gridArea = document.getElementById('grid-area');
      const rowEls = gridArea.querySelectorAll('.row');
      for (const rowEl of rowEls) {
        const rect = rowEl.getBoundingClientRect();
        if (e.clientY >= rect.top && e.clientY < rect.bottom) {
          const rowId = parseInt(rowEl.dataset.rowId);
          if (rowId && rowId !== block.rowId) {
            const newRow = rows.find(r => r.id === rowId);
            block.baseDuration = getBlockBaseDuration(block);
            block.duration = adjustedDurationForCapacity(block.baseDuration, 100, getRowCapacity(newRow));
            block.rowId = rowId;
            // Move bEl to the new row's cells; contingency auto-follows as a child of bEl
            const newCells = rowEl.querySelector('.row-cells');
            if (newCells && bEl) newCells.appendChild(bEl);
            if (bEl) {
              bEl.style.width = (getBlockBaseDuration(block) * dayPx() - 2) + 'px';
              const badge = bEl.querySelector('.block-days-badge');
              if (badge) badge.innerHTML = fmtBlockDuration(block);
            }
          }
          break;
        }
      }

      // Update position in-place (no full render during drag)
      if (bEl) {
        bEl.style.left = (block.start * dayPx()) + 'px';
        bEl.classList.add('dragging');
      }
      updateContingencyEl();
    }
    else if (dragState.type === 'resize-right') {
      block.baseDuration = Math.max(1, dragState.origBaseDuration + colDelta);
      block.duration = adjustedDurationForCapacity(block.baseDuration, 100, dragState.origCapacity);
      if (bEl) {
        bEl.style.width = (getBlockBaseDuration(block) * dayPx() - 2) + 'px';
        const badge = bEl.querySelector('.block-days-badge');
        if (badge) badge.innerHTML = fmtBlockDuration(block);
      }
      updateContingencyEl();
    }
    else if (dragState.type === 'resize-left') {
      const newStart = dragState.origStart + colDelta;
      const newBaseDuration = dragState.origBaseDuration - colDelta;
      if (newBaseDuration >= 1 && newStart >= 0) {
        block.start = newStart;
        block.baseDuration = newBaseDuration;
        block.duration = adjustedDurationForCapacity(block.baseDuration, 100, dragState.origCapacity);
        if (bEl) {
          bEl.style.left = (block.start * dayPx()) + 'px';
          bEl.style.width = (getBlockBaseDuration(block) * dayPx() - 2) + 'px';
          const badge = bEl.querySelector('.block-days-badge');
          if (badge) badge.innerHTML = fmtBlockDuration(block);
        }
        updateContingencyEl();
      }
    }
  }

  // Row reorder drag
  if (rowDragState) {
    const { rowId, source } = rowDragState;
    const isPanel = source === 'panel';
    const elList = isPanel
      ? [...document.querySelectorAll('.panel-section-header[data-row-id]')]
      : [...document.querySelectorAll('.row[data-row-id]')];
    const dragged = document.querySelector(`.${isPanel ? 'panel-section-header' : 'row'}[data-row-id="${rowId}"]`);

    // Hit-test: panel source → other panel section headers; grid source → other grid rows.
    let insertBefore = null;
    let indicatorY = null;
    let targetEl = null;

    for (let i = 0; i < elList.length; i++) {
      const rect = elList[i].getBoundingClientRect();
      const rId = parseInt(elList[i].dataset.rowId);
      if (rId === rowId) continue;
      const midY = rect.top + rect.height / 2;
      if (e.clientY < midY) {
        insertBefore = rId;
        indicatorY = rect.top;
        targetEl = elList[i];
        break;
      }
      indicatorY = rect.bottom;
    }

    // Move dragged row to follow cursor
    const dy = e.clientY - rowDragState.startMouseY;
    dragged.style.transform = `translateY(${dy}px)`;
    dragged.style.transition = 'none';

    // Compute where the dragged row's center is in document space
    const draggedRect = dragged.getBoundingClientRect();
    const draggedCenterDocY = draggedRect.top + draggedRect.height / 2;

    // Find which row slot the dragged center is over — traverse the LIVE DOM order
    // (which reflects the current rows[] order plus our transforms)
    const liveRows = [...document.querySelectorAll('.row[data-row-id]')].filter(r =>
      !r.classList.contains('row-drag-placeholder') && String(r.dataset.rowId) !== String(rowId)
    );

    let newInsertBefore = null;
    for (const r of liveRows) {
      const rect = r.getBoundingClientRect();
      if (draggedCenterDocY < rect.top + rect.height / 2) {
        newInsertBefore = parseInt(r.dataset.rowId);
        break;
      }
    }

    // Compute shift direction and magnitude from current insertBefore (not fromIdx)
    // This is the key: rows only shift by ONE slot at a time as insertBefore changes
    const prevInsertBefore = rowDragState.insertBefore;
    const prevInsertIdx = prevInsertBefore !== null
      ? rows.findIndex(r => r.id === prevInsertBefore)
      : rows.length;
    const newInsertIdx = newInsertBefore !== null
      ? rows.findIndex(r => r.id === newInsertBefore)
      : rows.length;

    // Reset all non-dragged rows to their natural position first
    liveRows.forEach(r => {
      r.style.transform = '';
      r.style.transition = 'transform 0.2s ease, opacity 0.15s ease';
      r.style.opacity = '';
    });

    // Then shift rows between prev and new insert positions
    const minI = Math.min(prevInsertIdx, newInsertIdx);
    const maxI = Math.max(prevInsertIdx, newInsertIdx);
    if (newInsertIdx < rows.length) {
      liveRows.forEach(r => {
        const idx = rows.findIndex(row => String(row.id) === String(r.dataset.rowId));
        if (idx > minI && idx <= maxI) {
          const dir = newInsertIdx < prevInsertIdx ? 1 : -1;
          r.style.transform = `translateY(${dir * rowDragState.rowH}px)`;
        }
      });
    }

    rowDragState.insertBefore = newInsertBefore;
    rowDragState.insertIdx = newInsertIdx;

    if (indicatorY !== null && rowDragIndicator) {
      rowDragIndicator.style.top = (indicatorY - 1) + 'px';
      if (isPanel) {
        const panelRect = document.getElementById('data-panel').getBoundingClientRect();
        rowDragIndicator.style.left = panelRect.left + 'px';
        rowDragIndicator.style.width = panelRect.width + 'px';
      } else {
        rowDragIndicator.style.left = '0';
        rowDragIndicator.style.width = ROW_HEADER_W + 'px';
      }
    }
  }

  // Create by drag preview
  if (createState) {
    const cells = document.querySelector(`.row-cells[data-row-id="${createState.rowId}"]`);
    if (cells && createState.preview) {
      const r = cells.getBoundingClientRect();
      const x = e.clientX - r.left;
      const endCol = Math.max(0, Math.floor(x / dayPx()));
      const start = Math.min(createState.startCol, endCol);
      const end = Math.max(createState.startCol, endCol);
      createState.currentCol = endCol;
      createState.preview.style.left = (start * dayPx()) + 'px';
      createState.preview.style.width = ((end - start + 1) * dayPx()) + 'px';
    }
  }
});

document.addEventListener('mouseup', (e) => {
  if (rowDragState) {
    const { rowId, insertBefore } = rowDragState;
    document.body.classList.remove('row-reordering');
    if (rowDragIndicator) rowDragIndicator.style.display = 'none';

    // Reset all transforms
    document.querySelectorAll('.row').forEach(r => {
      r.style.transform = '';
      r.style.transition = '';
      r.style.opacity = '';
    });

    // Reset dragged row styling
    const dragged = document.querySelector('.row.row-dragging');
    if (dragged) {
      dragged.style.position = '';
      dragged.style.top = '';
      dragged.style.left = '';
      dragged.style.width = '';
      dragged.style.zIndex = '';
      dragged.style.transform = '';
      dragged.classList.remove('row-dragging', 'row-lifted');
    }

    // Remove placeholder
    const ph = document.querySelector('.row-drag-placeholder');
    if (ph) ph.remove();

    // Apply state change
    const fromIdx = rows.findIndex(r => r.id === rowId);
    if (fromIdx !== -1) {
      const [moved] = rows.splice(fromIdx, 1);
      const toIdx = insertBefore !== null ? rows.findIndex(r => r.id === insertBefore) : rows.length;
      rows.splice(toIdx === -1 ? rows.length : toIdx, 0, moved);
      // Reorder DOM to match rows[]
      const wrapper = document.getElementById('grid-wrapper');
      const addRowEl = wrapper.querySelector('.add-row-btn')?.closest('.row');
      rows.forEach(row => {
        const el = wrapper.querySelector(`.row[data-row-id="${row.id}"]`);
        if (el && el !== addRowEl) wrapper.insertBefore(el, addRowEl);
      });
      renderPanel();
      saveState();
    }

    rowDragState = null;
    return;
  }

  if (dragState) {
    const wasMoved = dragState.moved;
    const draggedId = dragState.blockId;
    dragState = null;
    if (wasMoved) {
      // In-place updates already moved/resized the element. Just persist
      // and clean up the dragging class — no need for a full render.
      const el = document.querySelector(`[data-block-id="${draggedId}"]`);
      if (el) el.classList.remove('dragging');
      saveState();
      render();
    }
  }

  if (createState) {
    const rect = document.querySelector(`.row-cells[data-row-id="${createState.rowId}"]`);
    if (rect) {
      const r = rect.getBoundingClientRect();
      const x = e.clientX - r.left;
      const endCol = Math.max(0, Math.floor(x / dayPx()));
      const start = Math.min(createState.startCol, endCol);
      const end = Math.max(createState.startCol, endCol);
      const duration = end - start + 1;

      if (duration >= 2) {
        createBlock(createState.rowId, start, duration);
      } else if (createState.preview) {
        createState.preview.remove();
      }
    } else if (createState.preview) {
      createState.preview.remove();
    }
    createState = null;
  }
});

// --- Context menu ---
function showBlockContextMenu(e, blockId) {
  const menu = document.getElementById('context-menu');
  const block = blocks.find(b => b.id === blockId);
  if (!block) return;

  // Position — clamp to viewport edges
  const menuW = 140, menuH = 120;
  const left = Math.min(e.clientX, window.innerWidth - menuW - 8);
  const top  = Math.min(e.clientY, window.innerHeight - menuH - 8);
  menu.style.display = 'block';
  menu.style.left = left + 'px';
  menu.style.top  = top  + 'px';

  menu.innerHTML = '';

  // Colour label
  const label = document.createElement('div');
  label.className = 'context-menu-label';
  label.textContent = 'Colour';
  menu.appendChild(label);

  // Swatch grid
  const grid = document.createElement('div');
  grid.className = 'color-swatch-grid';
  for (let i = 0; i < COLORS; i++) {
    const sw = document.createElement('div');
    sw.className = `color-swatch block-color-${i}`;
    if (i === block.color) sw.classList.add('selected');
    sw.addEventListener('click', () => {
      block.color = i;
      render();
      menu.style.display = 'none';
    });
    grid.appendChild(sw);
  }
  menu.appendChild(grid);

  // Separator
  const sep = document.createElement('div');
  sep.className = 'context-menu-separator';
  menu.appendChild(sep);

  // Delete
  const del = document.createElement('div');
  del.className = 'context-menu-item danger';
  del.textContent = 'Delete';
  del.addEventListener('click', () => deleteBlock(blockId));
  menu.appendChild(del);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.context-menu')) {
    document.getElementById('context-menu').style.display = 'none';
  }
});

function renameBlock(id) {
  document.getElementById('context-menu').style.display = 'none';
  const block = blocks.find(b => b.id === id);
  if (!block) return;
  const name = prompt('Block name:', block.label || '');
  if (name !== null) { block.label = name; render(); }
}

function cycleColor(id) {
  document.getElementById('context-menu').style.display = 'none';
  const block = blocks.find(b => b.id === id);
  if (!block) return;
  block.color = (block.color + 1) % COLORS;
  render();
}

function duplicateBlock(id) {
  document.getElementById('context-menu').style.display = 'none';
  const block = blocks.find(b => b.id === id);
  if (!block) return;
  const clone = createBlock(block.rowId, block.start + block.duration + 1, getBlockBaseDuration(block), block.label, false, block.kind || 'grid');
  clone.color = block.color;
  render();
}

// --- Zoom ---
function syncViewButtons() {
  document.getElementById('btn-day')?.classList.toggle('active', zoom === 'day');
  document.getElementById('btn-week')?.classList.toggle('active', zoom === 'week');
  document.getElementById('btn-month')?.classList.toggle('active', zoom === 'month');
  document.getElementById('btn-table')?.classList.toggle('active', zoom === 'table');
  document.getElementById('btn-map')?.classList.toggle('active', zoom !== 'table');
}

function setZoom(z) {
  zoom = z;
  if (z !== 'table') mapZoom = z;
  syncViewButtons();
  render();
  saveState();
}

// --- Panel toggle ---
function jumpToToday() {
  const col = todayWeekdayCol();
  if (col === -1) return;
  const gridArea = document.getElementById('grid-area');
  const target = col * dayPx() - gridArea.clientWidth / 2;
  gridArea.scrollLeft = Math.max(0, target);
}

function togglePanel() {
  setZoom('table');
}

// --- Settings ---
function updateContingency() {
  const input = document.getElementById('contingency');
  contingencyPct = parseInt(input ? input.value : contingencyPct) || 0;
  contingencyPct = Math.max(0, Math.min(100, contingencyPct));
  render();
}

// --- Keyboard ---
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('context-menu').style.display = 'none';
  }
});

// v1 → v2 migration: v1 stored cols as calendar-day indices (weekends included);
// v2 stores weekday-only indices. Convert each block's start+duration.
// projectStart in v1 was always a Monday, and col 0 = calendar day 0 = Monday,
// so calendar cols where (col % 7) is 5 or 6 were weekends.
function migrateV1ToV2(savedBlocks) {
  const calIsWeekend = (col) => (col % 7) === 5 || (col % 7) === 6;
  const calToWeekday = (col) => {
    let n = 0;
    for (let c = 0; c < col; c++) if (!calIsWeekend(c)) n++;
    return n;
  };
  return (savedBlocks || []).map(b => {
    // If the block started on a weekend, snap forward to the next weekday.
    let start = b.start;
    while (calIsWeekend(start)) start++;
    const newStart = calToWeekday(start);
    // Count weekdays actually covered by the original span.
    let newDuration = 0;
    for (let c = b.start; c < b.start + b.duration; c++) {
      if (!calIsWeekend(c)) newDuration++;
    }
    if (newDuration < 1) newDuration = 1;
    return { ...b, start: newStart, duration: newDuration };
  });
}

// --- Init ---
async function init() {
  setupAuthUI();
  let user = null;
  try {
    user = await requireAuth();
  } catch (e) {
    document.getElementById('auth-error').textContent = e.message || String(e);
    setSyncStatus('error', 'Unauthorized');
    return;
  }
  if (!user) {
    setSyncStatus('offline', 'Locked');
    return;
  }
  showSignedIn(user);
  const saved = await loadState();
  _saveReady = true;
  if (saved) {
    // Restore state (Firestore or IndexedDB)
    rows = saved.rows || rows;
    normalizeRows();
    rowHeights = saved.rowHeights || {};
    rows.forEach(row => {
      if (!rowHeights[row.id] && row.height) rowHeights[row.id] = row.height;
    });
    blocks = saved.blocks || [];
    // v1 state had no version field and used calendar-day columns.
    if (!saved.version || saved.version < 2) {
      blocks = migrateV1ToV2(blocks);
      console.log('migrated', blocks.length, 'blocks from v1 (calendar) to v2 (weekday)');
    }
    normalizeBlocks();
    nextBlockId = saved.nextBlockId || (blocks.reduce((m, b) => Math.max(m, b.id), 0) + 1);
    nextRowId = saved.nextRowId || (rows.reduce((m, r) => Math.max(m, r.id), 0) + 1);
    contingencyPct = saved.contingencyPct || 0;
    zoom = saved.zoom || 'day';
    if (typeof saved.panelWidth === 'number') panelWidth = saved.panelWidth;
    if (saved.collapsedRows && typeof saved.collapsedRows === 'object') collapsedRows = saved.collapsedRows;
    // projectStart is now fixed (Jan 1 2026); intentionally ignore saved.projectStart.
    const contingencyInput = document.getElementById('contingency');
    if (contingencyInput) contingencyInput.value = contingencyPct;
    syncViewButtons();
  } else {
    normalizeRows();
    // First run: seed example blocks
    createBlock(1, 0, 5, 'Planning');
    createBlock(1, 6, 8, 'Design');
    createBlock(2, 3, 10, 'Frontend');
    createBlock(3, 8, 12, 'Backend');
    createBlock(2, 14, 6, 'Testing');
    saveState(); // write seed data to Firestore immediately
  }

  rowDragIndicator = document.createElement('div');
  rowDragIndicator.className = 'row-reordering-indicator';
  document.body.appendChild(rowDragIndicator);
  listenForChanges(); // start real-time sync
  applyRowHeights(); // apply saved row heights before first render
  render();
  document.getElementById('grid-area').addEventListener('mousedown', startPan);
}

function applyPanelWidth() {}
function setupPanelResize() {}

init();
</script>
