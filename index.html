<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<title>Blocks</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --border: #e9e5e0;
    --grid-bg: #f7f6f3;
    --grid-line: #e3ddd6;
    --text: #37352f;
    --dim: #9b9a97;
    --accent: #d9730d;
    --accent-dim: rgba(217, 115, 13, 0.08);
    --contingency: #448361;
    --header-bg: #f8f8f8;
    --row-alt: #fcfbf9;
    --cell-size: 40px;
    --row-header-width: 220px;
    --alt-bg: #f8f8f8;
    --today-bg: #ddeeff;
  }

  /* day-unit spans inherit surrounding text colour */
  .cg { color: inherit; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    padding: 0.6rem 1.2rem;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    gap: 1rem;
    flex-shrink: 0;
    z-index: 10;
  }

  .topbar h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
  }

  .topbar-controls {
    display: flex;
    gap: 0.4rem;
    margin-left: 0;
  }

  .topbar-status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-left: auto;
    justify-content: flex-end;
  }

  .topbar button {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.35rem 0.8rem;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 400;
  }

  .topbar button:hover { color: var(--text); background: var(--header-bg); }
  .topbar button.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* Grid area */
  .grid-area {
    flex: 1;
    position: relative;
    overflow: auto;
    cursor: default;
    min-height: 0; /* Override default stretch, rows determine height */
  }

  .grid-wrapper {
    position: relative;
    min-width: 100%;
    min-height: 0;
    flex: 1;
  }

  /* Column headers (timeline) */
  .col-headers-wrap {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #f8f8f8;
  }

  .col-headers {
    display: flex;
    border-bottom: 1px solid var(--border);
    width: max-content;
    min-width: 100%;
  }

  .row-header-spacer {
    width: var(--row-header-width);
    min-width: var(--row-header-width);
    border-right: 1px solid var(--border);
    background: #f8f8f8;
    position: sticky;
    left: 0;
    z-index: 2;
    flex-shrink: 0;
  }

  .col-header {
    width: var(--cell-size);
    min-width: var(--cell-size);
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: #666;
    border-right: 1px solid var(--border);
    user-select: none;
    font-family: inherit;
    background: #f8f8f8;
  }

  /* Alternating banding on header rows for readability. nth-child(1) is
     the row-header-spacer, so nth-child(even) hits the 1st, 3rd, 5th ... span. */
  .col-header:nth-child(even) { background: var(--alt-bg); }
  .month-span:nth-child(even) { background: var(--alt-bg); }
  .week-span:nth-child(even)  { background: var(--alt-bg); }

  /* Today's column — sky blue. Declared AFTER the alt-bg rules so same-
     specificity selectors win here. */
  .col-header.today,
  .cell-line.today,
  .month-span.today,
  .week-span.today {
    background: var(--today-bg);
  }


  /* Month header row */
  .month-span {
    height: 22px;
    display: flex;
    align-items: center;
    padding-left: 6px;
    font-size: 0.75rem;
    font-weight: 400;
    color: #666;
    border-right: 1px solid #ccc;
    font-family: inherit;
    background: #f8f8f8;
  }

  /* Week header row */
  .week-span {
    height: 22px;
    display: flex;
    align-items: center;
    padding-left: 6px;
    font-size: 0.75rem;
    font-weight: 400;
    color: #666;
    border-right: 1px solid var(--border);
    font-family: inherit;
    background: #f8f8f8;
  }

  /* Rows */
  .row {
    display: flex;
    border-bottom: 1px solid var(--grid-line);
    position: relative;
    width: max-content;
    min-width: 100%;
    height: var(--row-h, var(--cell-size));
  }
  .row-resize {
    position: absolute;
    bottom: -3px;
    left: 0;
    right: 0;
    height: 6px;
    cursor: row-resize;
    z-index: 10;
    border-bottom: 2px solid transparent;
  }
  .row-resize:hover,
  .row-resize.dragging {
    border-bottom-color: transparent;
  }

  /* Row resize handle */
  .row-resize-handle {
    position: absolute;
    bottom: -3px;
    left: 0;
    right: 0;
    height: 6px;
    cursor: ns-resize;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .row:hover .row-resize-handle,
  .row.resizing .row-resize-handle {
    opacity: 1;
  }
  .row.resizing { user-select: none; }

  .row-header {
    width: var(--row-header-width);
    min-width: var(--row-header-width);
    padding: 0 0.75rem;
    display: flex;
    align-items: center;
    border-right: 1px solid var(--border);
    background: #f8f8f8;
    position: sticky;
    left: 0;
    z-index: 3;
    font-size: 14px;
    font-weight: 500;
    cursor: text;
    height: 100%;
  }

  .row-header input {
    background: none;
    border: none;
    color: #555;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    outline: none;
  }

  .row-label-input {
    flex: 1;
    min-width: 0;
  }

  .capacity-control {
    display: flex;
    align-items: center;
    margin-left: 0.4rem;
    color: var(--dim);
    font-size: 0.75rem;
    flex-shrink: 0;
  }

  .row-header input.capacity-input {
    width: 42px;
    text-align: right;
    font-size: 0.8rem;
    color: var(--dim);
    padding: 0 1px;
  }

  .row-header input::placeholder { color: #ccc; }
  .resource-delete-btn {
    border: none;
    background: transparent;
    color: #aaa;
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    line-height: 1;
    padding: 0.1rem 0.25rem;
    border-radius: 4px;
    margin-left: 0.25rem;
    flex-shrink: 0;
  }
  .resource-delete-btn:hover { color: #dc2626; background: rgba(220,38,38,0.08); }

  .row-cells {
    display: flex;
    position: relative;
    flex: 0 0 auto;
    height: 100%;
  }

  /* Painted grid backgrounds — repeating gradients are dramatically faster
     than one DOM node per day for thousands of columns. Solid grey fill
     + darker vertical gridlines. Stride changes between zoom modes. */
  .row-cells.painted-day {
    background-color: var(--grid-bg);
    background-image: repeating-linear-gradient(
      to right,
      transparent 0, transparent 39px,
      var(--grid-line) 39px, var(--grid-line) 40px
    );
  }
  .row-cells.painted-week {
    background-color: var(--grid-bg);
    background-image: repeating-linear-gradient(
      to right,
      transparent 0, transparent 79px,
      var(--grid-line) 79px, var(--grid-line) 80px
    );
    /* background-position-x set inline to align lines with week header boundaries */
  }

  .row-cells.painted-month {
    background-color: var(--grid-bg);
  }

  /* Today overlay — single absolute div per row, painted on top of gradient */
  .today-overlay {
    position: absolute;
    top: 0;
    height: 100%;
    background: var(--today-bg);
    pointer-events: none;
    z-index: 0;
  }

  /* Month-view body cells (kept as DOM since month widths are variable). */
  .cell-line {
    height: 100%;
    border-right: 1px solid var(--border);
  }
  .row-cells .cell-line:nth-child(even) { background: var(--alt-bg); }
  /* today bg must override nth-child(even) for both even and odd cells */
  .row-cells .cell-line.today,
  .row-cells .cell-line:nth-child(even).today { background: var(--today-bg); }

  /* Blocks */
  .block {
    position: absolute;
    height: calc(100% - 6px);
    top: 3px;
    border-radius: 2px;
    cursor: grab;
    display: flex;
    align-items: center;
    padding: 0 10px;
    font-size: 0.85rem;
    font-weight: 500;
    color: inherit;
    user-select: none;
    transition: box-shadow 0.15s, opacity 0.15s;
    overflow: visible;
    z-index: 2;
    font-family: inherit;
  }

  .block:hover {
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  .block.dragging {
    opacity: 0.9;
    cursor: grabbing;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 10;
  }

  .block .handle-left,
  .block .handle-right {
    position: absolute;
    top: 0;
    width: 8px;
    height: 100%;
    cursor: ew-resize;
    z-index: 4;
  }

  .block .handle-left { left: 0; }
  .block .handle-right { right: 0; }

  .create-preview {
    position: absolute;
    top: 3px;
    height: calc(100% - 6px);
    border: 2px dotted #777;
    border-radius: 2px;
    background: rgba(255,255,255,0.25);
    pointer-events: none;
    z-index: 3;
  }

  .block .block-label {
    flex: 0 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    pointer-events: none;
    min-width: 0;
    position: relative;
    z-index: 3;
  }
  .block .block-days-badge {
    flex: 0 0 auto;
    margin-left: 4px;
    font-size: 0.75rem;
    font-weight: 500;
    opacity: 0.85;
    pointer-events: none;
    position: relative;
    z-index: 3;
  }
  .capacity-adjusted {
    color: #777;
    opacity: 0.75;
  }
  .capacity-block,
  .contingency-capacity-extension {
    position: absolute;
    top: 0;
    height: 100%;
    background: rgba(128,128,128,0.18);
    pointer-events: none;
    z-index: 1;
  }
  .capacity-block {
    height: calc(100% - 6px);
    top: 3px;
    border: 1px dashed #888;
    border-radius: 2px;
    user-select: none;
  }
  .capacity-block::after,
  .contingency-capacity-extension::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 4px,
      rgba(120,120,120,0.22) 4px,
      rgba(120,120,120,0.22) 8px
    );
  }

  .block-contingency .contingency-days {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.75rem;
    font-weight: 500;
    color: #777;
    z-index: 2;
  }
  .block .block-label-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font: inherit;
    color: inherit;
    padding: 0;
    margin: 0;
    user-select: text;
    cursor: text;
  }

  /* Block colours — oranges, browns, greens */
  .block-color-0 { background: #e8e6e3; color: #4b4a47; } /* gray */
  .block-color-1 { background: #fdecc8; color: #6b4c1f; } /* yellow */
  .block-color-2 { background: #fadec9; color: #7a3e1f; } /* orange */
  .block-color-3 { background: #f7d5d2; color: #803837; } /* red */
  .block-color-4 { background: #eed7e0; color: #693b4a; } /* pink */
  .block-color-5 { background: #e2d4ee; color: #5a3f6b; } /* purple */
  .block-color-6 { background: #d6e4ee; color: #3a5a73; } /* blue */
  .block-color-7 { background: #d7ece2; color: #2e5e45; } /* green */
  .block-color-8 { background: #f3e4c7; color: #6b5220; } /* tan */

  /* Data panel */
  .data-panel {
    width: 280px;
    min-width: 200px;
    max-width: 800px;
    background: var(--bg);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .data-panel.hidden { display: none; }
  .data-panel { display: none; }

  .panel-resize-handle {
    position: absolute;
    top: 0;
    left: -3px;
    width: 6px;
    height: 100%;
    cursor: ew-resize;
    z-index: 20;
    background: transparent;
  }
  .panel-resize-handle:hover,
  .panel-resize-handle.dragging {
    background: var(--accent);
    opacity: 0.4;
  }
  body.panel-resizing {
    cursor: ew-resize;
    user-select: none;
  }

  .panel-header {
    padding: 0.6rem 1rem;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-bottom: 1px solid var(--border);
  }

  .panel-stats {
    padding: 0.8rem 1rem;
    border-bottom: 1px solid var(--border);
  }

  .panel-stat {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    padding: 0.2rem 0;
  }

  .panel-stat .label { color: var(--dim); }
  .panel-stat .value { color: var(--accent); font-weight: 500; }

  .panel-blocks {
    flex: 1;
    overflow-y: auto;
  }

  .panel-block-item {
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.1s;
  }

  .panel-block-item:hover { background: var(--surface); }

  .panel-block-item .block-name {
    font-weight: 500;
    margin-bottom: 0.2rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  /* Editable name hints in the panel */
  .panel-block-name-text:hover,
  .panel-row-label:hover {
    text-decoration: underline;
    text-decoration-style: dotted;
    cursor: text;
  }

  .panel-name-input {
    background: transparent;
    border: none;
    outline: none;
    font: inherit;
    color: inherit;
    padding: 0;
    margin: 0;
    width: 100%;
    min-width: 40px;
  }

  .panel-block-item .block-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .panel-block-item .block-meta {
    color: var(--dim);
    font-size: 0.75rem;
  }

  .panel-section-header {
    padding: 0.5rem 1rem;
    font-size: 0.85rem;
    font-weight: 500;
    color: #444;
    background: #f5f5f5;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .panel-section-header:hover { background: #ececec; }
  .panel-section-header .caret {
    display: inline-block;
    width: 10px;
    margin-right: 0.4rem;
    transition: transform 0.12s;
    color: var(--dim);
  }
  .panel-section-header.collapsed .caret { transform: rotate(-90deg); }
  .panel-section-header .section-title { flex: 1; display: flex; align-items: center; }
  .panel-section-body.collapsed { display: none; }

  /* 3-column days display in section header */
  .section-days-3col {
    display: flex;
    gap: 0.5rem;
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--dim);
  }
  .section-days-3col .sec-base { color: var(--text); }
  .section-days-3col .sec-conting { color: var(--contingency); }
  .section-days-3col .sec-total { color: var(--text); font-weight: 700; }

  /* Row totals bar at bottom of section body */
  .section-totals {
    display: flex;
    align-items: center;
    padding: 0.4rem 1rem;
    border-top: 1px solid var(--border);
    background: #f8f8f8;
    font-size: 0.8rem;
    gap: 0.5rem;
    color: var(--dim);
  }
  .section-totals .totals-label { font-weight: 500; color: #666; flex: 1; }
  .section-totals .totals-base { color: var(--text); }
  .section-totals .totals-conting { color: var(--contingency); }
  .section-totals .totals-total { color: var(--text); font-weight: 700; }
  .section-totals .totals-col { min-width: 40px; text-align: right; }

  .section-days {
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--dim);
  }

  .block-days {
    margin-left: auto;
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--dim);
  }

  .panel-settings {
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .setting-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    color: #555;
    cursor: pointer;
  }

  .setting-row input[type="checkbox"] {
    accent-color: var(--accent);
  }

  /* Contingency extension on blocks — lives inside .block (overflow:visible) so it
     auto-follows the block during drag without needing separate position updates. */
  .block-contingency {
    position: absolute;
    height: 100%;
    top: 0;
    border-radius: 0 2px 2px 0;
    pointer-events: none;
    z-index: 1;
    border: 1px solid;
    border-left: none;
  }

  .block-contingency::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 3px,
      rgba(255,255,255,0.4) 3px,
      rgba(255,255,255,0.4) 6px
    );
  }

  .block-contingency.block-color-0 { background: rgba(75, 74, 71, 0.18);  border-color: #b4b0ab; }
  .block-contingency.block-color-1 { background: rgba(107, 76, 31, 0.18);  border-color: #d3a05a; }
  .block-contingency.block-color-2 { background: rgba(122, 62, 31, 0.18);  border-color: #d4845a; }
  .block-contingency.block-color-3 { background: rgba(128, 56, 55, 0.18);  border-color: #cf7b7a; }
  .block-contingency.block-color-4 { background: rgba(105, 59, 74, 0.18);  border-color: #c88ba0; }
  .block-contingency.block-color-5 { background: rgba(90, 63, 107, 0.18);  border-color: #b89acd; }
  .block-contingency.block-color-6 { background: rgba(58, 90, 115, 0.18);  border-color: #8bb4cf; }
  .block-contingency.block-color-7 { background: rgba(46, 94, 69, 0.18);   border-color: #7dbfa0; }
  .block-contingency.block-color-8 { background: rgba(107, 82, 32, 0.18);  border-color: #c9a863; }

  /* Add row button — applied to the sticky row-header of the add-row row */
  .add-row-btn {
    color: #ccc;
    font-size: 0.8rem;
    cursor: pointer;
    height: 32px;
  }

  .add-row-btn:hover { color: var(--accent); }

  /* Row drag handles */
  .row-drag-handle {
    cursor: grab;
    color: #ccc;
    font-size: 0.85rem;
    line-height: 1;
    padding: 0 6px 0 0;
    flex-shrink: 0;
    user-select: none;
    display: flex;
    align-items: center;
  }
  .row-drag-handle:hover { color: #999; }
  body.row-reordering { cursor: grabbing !important; user-select: none; }
  body.row-reordering .row:not(.row-dragging) {
    opacity: 0.7;
    transition: opacity 0.1s, transform 0.2s ease;
  }
  body.row-reordering .row:not(.row-dragging):not(.row-drag-placeholder) {
    will-change: transform;
  }
  body.row-reordering .panel-section-header:not(.row-dragging) {
    opacity: 0.7;
    transition: opacity 0.1s;
  }
  .row-reordering-indicator {
    position: fixed;
    height: 2px;
    background: var(--accent);
    pointer-events: none;
    z-index: 1000;
    display: none;
  }
  /* Row drag effects — lifted row + drop shadow + scaled ghost */
  .row.row-dragging {
    opacity: 1;
    box-shadow: 0 12px 36px rgba(0,0,0,0.22), 0 4px 12px rgba(0,0,0,0.15);
    z-index: 200;
    position: absolute;
    left: 0; right: 0;
    pointer-events: none;
    will-change: transform;
    transition: box-shadow 0.15s ease;
  }
  .row.row-dragging.row-lifted {
    box-shadow: 0 20px 50px rgba(0,0,0,0.28), 0 6px 16px rgba(0,0,0,0.18);
  }
  /* Placeholder row that maintains list height during drag */
  .row.row-drag-placeholder {
    visibility: hidden;
    pointer-events: none;
  }
  .row.row-drag-placeholder.row-drag-placeholder-active {
    visibility: visible;
  }
  .panel-section-header.row-dragging {
    opacity: 1;
    box-shadow: 0 12px 36px rgba(0,0,0,0.22);
    z-index: 200;
  }

<script>
// --- State ---
const CELL_W = 40;           // px per day in day view
const WEEK_DAY_PX = 16;      // px per day in week view — 5 × 16 = 80px per week cell
const MONTH_DAY_PX = 5;      // px per day in month view — typical ~22-day month ≈ 110px wide
const ROW_H = 40;

// Pixels per *day* at the current zoom. Blocks are always day-indexed in the
// data model; this just controls how wide a day renders. In week view each
// visual cell is 5 × WEEK_DAY_PX = 80px wide with no day subdivisions drawn,
// but blocks position + size against day-level pixels underneath.
function dayPx() {
  if (zoom === 'week') return WEEK_DAY_PX;
  if (zoom === 'month') return MONTH_DAY_PX;
  return CELL_W;
}
// For week view we use a fixed 5-day stride. Month view has variable month
// widths (handled inline in render via per-month iteration), so daysPerCell
// is only meaningful for day/week.
function daysPerCell() { return zoom === 'week' ? 5 : 1; }
function cellVisualW() { return dayPx() * daysPerCell(); }
const ROW_HEADER_W = 220;
const COLORS = 9;
const ROW_H_MIN = 30;
const ROW_H_DEFAULT = 40;
const ROW_H_MAX = 120;

// --- Firebase shared state ---
// Replace with your actual Firebase project config from:
// https://console.firebase.google.com → Project Settings → Your apps → SDK setup
let _db = null;   // Firestore ref (set by firebaseInit below)
let _auth = null; // Firebase Auth ref
let _currentUser = null;
const FIREBASE_API_KEY     = 'AIzaSyDWANMFaYLy54EYudU4S5svY_0F1uLDaFs';
const FIREBASE_AUTH_DOMAIN = 'blocks-shared.firebaseapp.com';
const FIREBASE_PROJECT_ID  = 'blocks-shared';

// SECURITY: set this to the single account allowed to open/write this app.
// Firestore rules must enforce the same email or uid; UI checks are convenience only.
const ALLOWED_EMAILS = [
  'dan.croucher@gmail.com',
];

function firebaseInit() {
  if (typeof firebase === 'undefined') {
    console.warn('Firebase SDK not loaded'); return;
  }
  firebase.initializeApp({
    apiKey:             FIREBASE_API_KEY,
    authDomain:         FIREBASE_AUTH_DOMAIN,
    projectId:          FIREBASE_PROJECT_ID,
    storageBucket:      'blocks-shared.firebasestorage.app',
    messagingSenderId:  '322779812327',
    appId:              '1:322779812327:web:4655738cad49855915ed42',
  });
  _auth = firebase.auth();
  _db = firebase.firestore();
}
firebaseInit();

// Timeline runs from PROJECT_START_DATE through PROJECT_END_DATE inclusive
// (weekdays only). TOTAL_COLS is computed from these.
const PROJECT_START_DATE = new Date(2026, 0, 1);   // 2026-01-01 (Thu)
const PROJECT_END_DATE   = new Date(2028, 11, 31); // 2028-12-31 (Sun)
function countWeekdaysInclusive(from, to) {
  const a = new Date(from); a.setHours(0,0,0,0);
  const b = new Date(to);   b.setHours(0,0,0,0);
  let n = 0;
  for (let d = new Date(a); d <= b; d.setDate(d.getDate() + 1)) {
    const wd = d.getDay();
    if (wd !== 0 && wd !== 6) n++;
  }
  return n;
}
const TOTAL_COLS = countWeekdaysInclusive(PROJECT_START_DATE, PROJECT_END_DATE);
const STATE_VERSION = 3; // v2 = weekday-indexed cols; v3 = grid/data block kinds

// Format: "[base]d + [conting]d ([total]d)" when contingency > 0, else "[base]d".
// The letter 'd' and any contingency amount are wrapped in .cg for styling.
function fmtDays(base, conting) {
  if (conting > 0) {
    const total = base + conting;
    return `${base}<span class="cg">d</span> + <span class="cg">${conting}d</span> (${total}<span class="cg">d</span>)`;
  }
  return `${base}<span class="cg">d</span>`;
}

// --- Firestore persistence (primary) + IndexedDB (local fallback) ---
const DB_NAME = 'blocks-db';
const STORE = 'state';
const STATE_KEY = 'app';
const DOC_PATH = 'projects/blocks';
const BACKUPS_PATH = `${DOC_PATH}/backups`;
const AUTO_BACKUP_MIN_INTERVAL_MS = 5 * 60 * 1000;
let _dbPromise = null;
let _unsub = null; // Firestore listener unsubscribe
let _lastBackupAt = 0;
const CLIENT_ID = `${Date.now()}-${Math.random().toString(36).slice(2)}`;

function setSyncStatus(status, text) {
  const pill = document.getElementById('sync-status');
  const label = document.getElementById('sync-status-text');
  if (pill) pill.dataset.status = status;
  if (label) label.textContent = text;
}

function isAllowedUser(user) {
  if (!user || !user.email) return false;
  return ALLOWED_EMAILS.map(e => e.toLowerCase()).includes(user.email.toLowerCase());
}

function requireAuth() {
  return new Promise((resolve, reject) => {
    if (!_auth) return reject(new Error('Firebase Auth not available'));
    const unsub = _auth.onAuthStateChanged((user) => {
      unsub();
      if (!user) return resolve(null);
      if (!isAllowedUser(user)) return reject(new Error(`Unauthorized account: ${user.email}`));
      _currentUser = user;
      resolve(user);
    }, reject);
  });
}

function authErrorMessage(e) {
  const code = e && e.code;
  if (code === 'auth/configuration-not-found') {
    return 'Firebase Auth is not enabled/configured for this project. In Firebase Console, enable Authentication → Google provider, then add this site domain under Authorized domains.';
  }
  if (code === 'auth/unauthorized-domain') {
    return 'This site domain is not authorized in Firebase Auth. Add the deployed domain in Authentication → Settings → Authorized domains.';
  }
  return (e && e.message) || String(e);
}

function setupAuthUI() {
  const login = document.getElementById('btn-login');
  const logout = document.getElementById('btn-logout');
  if (login) login.onclick = async () => {
    const error = document.getElementById('auth-error');
    if (error) error.textContent = '';
    try {
      await _auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      location.reload();
    } catch (e) {
      if (error) error.textContent = authErrorMessage(e);
    }
  };
  if (logout) logout.onclick = async () => {
    if (_unsub) _unsub();
    await _auth.signOut();
    location.reload();
  };
}

function showSignedIn(user) {
  document.getElementById('auth-screen')?.classList.add('auth-hidden');
  const pill = document.getElementById('user-pill');
  const email = document.getElementById('user-email');
  if (email) email.textContent = user.email || 'Signed in';
  if (pill) pill.classList.remove('auth-hidden');
  setSyncStatus('saving', 'Loading');
}

function sanitizeState(data) {
  if (!data || typeof data !== 'object') return null;
  if (!Array.isArray(data.rows) || !Array.isArray(data.blocks)) return null;
  return data;
}

function snapshotState() {
  return {
    version: STATE_VERSION,
    rows, blocks, rowHeights, nextBlockId, nextRowId,
    contingencyPct, zoom, panelWidth, collapsedRows,
    projectStart: projectStart.toISOString(),
    savedAt: Date.now(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedBy: _currentUser ? { uid: _currentUser.uid, email: _currentUser.email } : null,
  };
}

async function writeBackup(snapshot, reason = 'auto') {
  if (!_db || !_currentUser) return;
  const now = Date.now();
  if (reason === 'auto' && now - _lastBackupAt < AUTO_BACKUP_MIN_INTERVAL_MS) return;
  _lastBackupAt = now;
  try {
    await _db.collection(BACKUPS_PATH).doc(String(now)).set({
      ...snapshot,
      backupReason: reason,
      backupCreatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  } catch (e) {
    console.warn('Firestore backup failed:', e);
  }
}

function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}

// Load from Firestore first, fall back to IndexedDB
async function loadState() {
  // Try Firestore
  if (_db) {
    try {
      const snap = await _db.doc(DOC_PATH).get();
      if (snap.exists) {
        console.log('State loaded from Firestore');
        return sanitizeState(snap.data());
      }
    } catch (e) {
      console.warn('Firestore load failed, falling back to IndexedDB:', e);
    }
  }
  // IndexedDB fallback
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const req = db.transaction(STORE, 'readonly').objectStore(STORE).get(STATE_KEY);
      req.onsuccess = () => resolve(sanitizeState(req.result) || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    console.warn('IndexedDB loadState failed:', e);
    return null;
  }
}

// Debounced save — Firestore primary + IndexedDB local fallback
let _saveTimer = null;
let _saveReady = false;
function saveState() {
  if (!_saveReady) return;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    const snapshot = snapshotState();

    // Firestore — ignore failure (offline etc.), fallback persists locally
    if (_db && _currentUser) {
      try {
        setSyncStatus('saving', 'Saving');
        await writeBackup(snapshot, 'auto');
        await _db.doc(DOC_PATH).set({ ...snapshot, _clientId: CLIENT_ID }, { merge: false });
        setSyncStatus('saved', 'Saved');
      } catch (e) {
        setSyncStatus('error', 'Save failed');
        console.warn('Firestore save failed:', e);
      }
    }

    // IndexedDB local backup
    try {
      const db = await openDB();
      db.transaction(STORE, 'readwrite').objectStore(STORE).put(snapshot, STATE_KEY);
    } catch (e) {
      console.warn('IndexedDB saveState failed:', e);
    }
  }, 200);
}

// Listen for remote state changes and apply them
function listenForChanges() {
  if (!_db) return;
  _unsub = _db.doc(DOC_PATH).onSnapshot((snap) => {
    const data = snap.data();
    if (!data) return;
    // Ignore our own writes (echo prevention)
    if (data._clientId === CLIENT_ID) return;
    const remote = sanitizeState({ ...data });
    if (!remote) return;
    delete remote._clientId;
    setSyncStatus('saving', 'Syncing');
    applyRemoteState(remote);
    setSyncStatus('saved', 'Synced');
  }, (err) => {
    console.warn('Firestore listener error:', err);
  });
}

// Apply state received from Firestore remote write
function applyRemoteState(data) {
  if (!data || typeof data !== 'object') return;
  if (data.rows)     { rows           = data.rows; }
  if (data.blocks)   { blocks         = data.blocks; }
  if (data.nextBlockId != null) nextBlockId = data.nextBlockId;
  if (data.nextRowId != null)   nextRowId   = data.nextRowId;
  if (data.contingencyPct != null) contingencyPct = data.contingencyPct;
  if (data.collapsedRows) collapsedRows = data.collapsedRows;
  if (data.zoom)     zoom = data.zoom;
  if (typeof data.panelWidth === 'number') panelWidth = data.panelWidth;
  if (data.rowHeights) {
    rowHeights = data.rowHeights;
  }
  // Sync rowHeights with row.height values from rows
  rows.forEach(row => {
    if (!rowHeights[row.id] && row.height) rowHeights[row.id] = row.height;
  });
  normalizeRows();
  normalizeBlocks();

  // Sync UI
  const contingencyInput = document.getElementById('contingency');
  if (contingencyInput) contingencyInput.value = contingencyPct;
  syncViewButtons();

  // Re-render without full state write-back
  _renderScheduled = false;
  render();
  renderPanel();
}

let zoom = 'day'; // day, week, month, table
let mapZoom = 'day'; // last non-table view used by the Map tab
let rows = [
  { id: 1, label: '', height: 0, capacity: 100 },
  { id: 2, label: '', height: 0, capacity: 100 },
  { id: 3, label: '', height: 0, capacity: 100 },
  { id: 4, label: '', height: 0, capacity: 100 },
  { id: 5, label: '', height: 0, capacity: 100 },
];
let blocks = [];
let rowHeights = {}; // { rowId: height }
let nextBlockId = 1;
let nextRowId = 6;
let contingencyPct = 0;
let panelWidth = 280;
let collapsedRows = {}; // { [rowId]: true } — sections collapsed in the data panel

// --- Header drag-to-pan ---
let panState = null; // { startX, startScrollLeft }

function startPan(e) {
 if (zoom === 'table') return;
 if (e.target.closest('input, select, button, textarea')) return;
 if (e.target.closest('.block') || e.target.closest('.handle-left') || e.target.closest('.handle-right')) return;
 const gridEl = document.getElementById('grid-area');
 panState = {
 startX: e.clientX,
 startScrollLeft: gridEl.scrollLeft,
 };
 gridEl.classList.add('panning');
 document.querySelectorAll('.col-headers').forEach(el => el.classList.add('panning'));
}

function endPan() {
 panState = null;
 const gridEl = document.getElementById('grid-area');
 gridEl.classList.remove('panning');
 document.querySelectorAll('.col-headers').forEach(el => el.classList.remove('panning'));
}

document.addEventListener('mousemove', (e) => {
 if (!panState) return;
 const gridEl = document.getElementById('grid-area');
 const dx = panState.startX - e.clientX;
 gridEl.scrollLeft = panState.startScrollLeft + dx;
});

document.addEventListener('mouseup', endPan);


function makeRow(id) { return { id, label: '', height: 0, capacity: 100 }; }
function getRowCapacity(row) {
  const cap = Number(row && row.capacity);
  return Number.isFinite(cap) && cap > 0 ? cap : 100;
}
function normalizeRows() {
  rows.forEach(row => {
    if (!row || !Number.isFinite(Number(row.capacity)) || Number(row.capacity) <= 0) row.capacity = 100;
  });
}
function getBlockBaseDuration(block) {
  const base = Number(block && block.baseDuration);
  return Number.isFinite(base) && base > 0 ? base : (Number(block && block.duration) || 1);
}
function fmtBlockDuration(block) {
  const base = getBlockBaseDuration(block);
  const scheduled = Number(block.duration) || base;
  const baseContingency = contingencyPct > 0 ? Math.round(base * contingencyPct / 100) : 0;
  const scheduledContingency = contingencyPct > 0 ? Math.round(scheduled * contingencyPct / 100) : 0;
  const baseText = baseContingency > 0 ? `${base}+${baseContingency}<span class="cg">d</span>` : `${base}<span class="cg">d</span>`;
  if (scheduled !== base || scheduledContingency !== baseContingency) {
    const scheduledText = scheduledContingency > 0 ? `${scheduled}+${scheduledContingency}d` : `${scheduled}d`;
    return `${baseText} <span class="capacity-adjusted">(${scheduledText})</span>`;
  }
  return baseText;
}
function fmtContingencyDuration(baseDays, scheduledDays) {
  if (scheduledDays !== baseDays) return `+${baseDays}d <span class="capacity-adjusted">(+${scheduledDays}d)</span>`;
  return `+${baseDays}d`;
}
function normalizeBlocks() {
  blocks.forEach(block => {
    const row = rows.find(r => r.id === block.rowId);
    if (block.kind !== 'data') block.kind = 'grid';
    if (!Number.isFinite(Number(block.baseDuration)) || Number(block.baseDuration) <= 0) {
      block.baseDuration = adjustedDurationForCapacity(block.duration || 1, getRowCapacity(row), 100);
    }
    block.duration = adjustedDurationForCapacity(block.baseDuration, 100, getRowCapacity(row));
  });
}
function isDataBlock(block) { return block && block.kind === 'data'; }
function setBlockBaseDuration(block, baseDuration) {
  const row = rows.find(r => r.id === block.rowId);
  block.baseDuration = Math.max(1, Math.round(Number(baseDuration) || 1));
  block.duration = adjustedDurationForCapacity(block.baseDuration, 100, getRowCapacity(row));
}
function adjustedDurationForCapacity(duration, oldCapacity, newCapacity) {
  const oldCap = Math.max(1, Number(oldCapacity) || 100);
  const newCap = Math.max(1, Number(newCapacity) || 100);
  return Math.max(1, Math.round(duration * oldCap / newCap));
}
function setRowCapacity(row, nextCapacity) {
  const oldCapacity = getRowCapacity(row);
  const newCapacity = Math.max(1, Math.min(999, Math.round(Number(nextCapacity) || 100)));
  if (newCapacity === oldCapacity) { row.capacity = newCapacity; return; }
  blocks.forEach(block => {
    if (block.rowId === row.id) {
      block.baseDuration = getBlockBaseDuration(block);
      block.duration = adjustedDurationForCapacity(block.baseDuration, 100, newCapacity);
    }
  });
  row.capacity = newCapacity;
  render();
}

// --- Date helpers ---
// Project timeline is fixed (see PROJECT_START_DATE / PROJECT_END_DATE).
const projectStart = new Date(PROJECT_START_DATE);
projectStart.setHours(0,0,0,0);

// Returns the weekday-col index for today, or -1 if today isn't on the grid
// (weekend or outside [projectStart, projectEnd]).
// Returns the nearest weekday-col index for today.
// If today is itself a weekday, that's returned.
// If today is a weekend, the nearest past Friday is used as the visual stand-in.
function todayWeekdayCol() {
  const t = new Date(); t.setHours(0,0,0,0);
  let wd = t.getDay();
  // If weekend, snap back to Friday ( Sat→-1, Sun→-2 )
  if (wd === 0) wd = -2; // Sunday → Friday
  else if (wd === 6) wd = -1; // Saturday → Friday
  const tAdj = new Date(t);
  tAdj.setDate(tAdj.getDate() + wd);
  if (tAdj < projectStart || tAdj > PROJECT_END_DATE) return -1;
  let n = 0;
  const d = new Date(projectStart);
  while (d <= tAdj) {
    const day = d.getDay();
    if (day !== 0 && day !== 6) n++;
    d.setDate(d.getDate() + 1);
  }
  return n - 1;
}

// Grid is weekday-only: col 0 = projectStart (a Monday), col 1 = next weekday,
// weekends never get a column. `colToDate` advances one weekday at a time.
function colToDate(col) {
  const d = new Date(projectStart);
  let added = 0;
  while (added < col) {
    d.setDate(d.getDate() + 1);
    const day = d.getDay();
    if (day !== 0 && day !== 6) added++;
  }
  return d;
}

function formatDate(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d.getDate()} ${months[d.getMonth()]}`;
}

function formatDateFull(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}

function toDateInputValue(d) {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function dateInputToCol(value) {
  const d = new Date(value + 'T00:00:00');
  if (Number.isNaN(d.getTime())) return 0;
  d.setHours(0,0,0,0);
  // Snap weekends forward to Monday.
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  if (d < projectStart) return 0;
  let col = 0;
  const cursor = new Date(projectStart);
  while (cursor < d && col < TOTAL_COLS - 1) {
    cursor.setDate(cursor.getDate() + 1);
    const day = cursor.getDay();
    if (day !== 0 && day !== 6) col++;
  }
  return Math.max(0, Math.min(TOTAL_COLS - 1, col));
}

}

function _render() {
  const wrapper = document.getElementById('grid-wrapper');
  gridWrapper = wrapper;
  wrapper.innerHTML = '';
  if (zoom === 'table') {
    renderTableView(wrapper);
    renderPanel();
    saveState();
    return;
  }

  // Column headers wrapper
  const headersWrap = document.createElement('div');
  headersWrap.className = 'col-headers-wrap';

  const dayLetters = ['S','M','T','W','T','F','S'];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // For today's-column highlight — compare stamps, not Date objects.
  const todayStamp = (() => {
    const t = new Date(); t.setHours(0,0,0,0);
    const wd = t.getDay();
    // If weekend, stand in on Friday
    if (wd === 0) t.setDate(t.getDate() - 2); // Sun → Fri
    else if (wd === 6) t.setDate(t.getDate() - 1); // Sat → Fri
    return t.getTime();
  })();
  const isToday = (d) => { const c = new Date(d); c.setHours(0,0,0,0); return c.getTime() === todayStamp; };

  // --- Row 1: Months ---
  const monthRow = document.createElement('div');
  monthRow.className = 'col-headers month-header-row';
  const monthSpacer = renderMapControls();
  monthRow.appendChild(monthSpacer);

  let c = 0;
  while (c < TOTAL_COLS) {
    const d = colToDate(c);
    const thisMonth = d.getMonth();
    const thisYear = d.getFullYear();
    let span = 0;
    while (c + span < TOTAL_COLS) {
      const d2 = colToDate(c + span);
      if (d2.getMonth() !== thisMonth || d2.getFullYear() !== thisYear) break;
      span++;
    }
    // Highlight the month containing today
    let monthHasToday = false;
    for (let k = 0; k < span; k++) {
      if (isToday(colToDate(c + k))) { monthHasToday = true; break; }
    }
    const monthEl = document.createElement('div');
    monthEl.className = 'month-span' + (monthHasToday ? ' today' : '');
    monthEl.style.width = (span * dayPx()) + 'px';
    monthEl.style.minWidth = (span * dayPx()) + 'px';
    monthEl.textContent = monthNames[thisMonth] + ' ' + thisYear;
    monthRow.appendChild(monthEl);
    c += span;
  }
  headersWrap.appendChild(monthRow);

  // --- Row 2: Weeks (w/c date) — hidden in month view ---
  if (zoom !== 'month') {
    const weekRow = document.createElement('div');
    weekRow.className = 'col-headers';
    const weekSpacer = document.createElement('div');
    weekSpacer.className = 'row-header-spacer';
    weekRow.appendChild(weekSpacer);

    c = 0;
    while (c < TOTAL_COLS) {
      const d = colToDate(c);
      // Find start of this week (Monday)
      let span = 0;
      const weekDay = d.getDay();
      // Count days until next Monday or end
      while (c + span < TOTAL_COLS) {
        const d2 = colToDate(c + span);
        if (span > 0 && d2.getDay() === 1) break;
        span++;
      }
      // Highlight the week containing today
      let weekHasToday = false;
      for (let k = 0; k < span; k++) {
        if (isToday(colToDate(c + k))) { weekHasToday = true; break; }
      }
      const weekEl = document.createElement('div');
      weekEl.className = 'week-span' + (weekHasToday ? ' today' : '');
      weekEl.style.width = (span * dayPx()) + 'px';
      weekEl.style.minWidth = (span * dayPx()) + 'px';
      // Find the Monday of this week
      const monday = new Date(d);
      monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
      weekEl.textContent = 'w/c ' + formatDate(monday);
      weekRow.appendChild(weekEl);
      c += span;
    }
    headersWrap.appendChild(weekRow);
  }

  // --- Rows 3 & 4: Day letters + date numbers (day view only) ---
  if (zoom === 'day') {
    const dayRow = document.createElement('div');
    dayRow.className = 'col-headers';
    const daySpacer = document.createElement('div');
    daySpacer.className = 'row-header-spacer';
    dayRow.appendChild(daySpacer);

    const dateRow = document.createElement('div');
    dateRow.className = 'col-headers';
    const dateSpacer = document.createElement('div');
    dateSpacer.className = 'row-header-spacer';
    dateRow.appendChild(dateSpacer);

    // Walk dates once, populate both rows in one pass via fragments.
    const dayFrag = document.createDocumentFragment();
    const dateFrag = document.createDocumentFragment();
    const walker = new Date(projectStart);
    for (let c = 0; c < TOTAL_COLS; c++) {
      // Skip weekends
      while (walker.getDay() === 0 || walker.getDay() === 6) walker.setDate(walker.getDate() + 1);
      const today = isToday(walker);
      const dayCh = document.createElement('div');
      dayCh.className = today ? 'col-header today' : 'col-header';
      dayCh.textContent = dayLetters[walker.getDay()];
      dayFrag.appendChild(dayCh);

      const dateCh = document.createElement('div');
      dateCh.className = today ? 'col-header today' : 'col-header';
      dateCh.textContent = walker.getDate();
      dateFrag.appendChild(dateCh);

      walker.setDate(walker.getDate() + 1);
    }
    dayRow.appendChild(dayFrag);
    dateRow.appendChild(dateFrag);
    headersWrap.appendChild(dayRow);
    headersWrap.appendChild(dateRow);
  }

  wrapper.appendChild(headersWrap);

  // Rows
  rows.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    rowEl.dataset.rowId = row.id;
    const rowH = rowHeights[row.id] || row.height || ROW_H_DEFAULT;

    // Row resize handle at bottom of row

    resizeHandle.className = 'row-resize';
    resizeHandle.title = 'Drag to resize';
    resizeHandle.addEventListener('mousedown', (e) => startRowResize(e, row.id));
    rowEl.appendChild(resizeHandle);

    // Row header
    const header = document.createElement('div');
    header.className = 'row-header';

    // Drag handle
