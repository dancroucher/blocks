function _render() {
  const wrapper = document.getElementById('grid-wrapper');
  gridWrapper = wrapper;
  wrapper.innerHTML = '';
  if (zoom === 'table') {
    renderTableView(wrapper);
    schedulePostRenderWork();
    return;
  }

  // Column headers wrapper
  const headersWrap = document.createElement('div');
  headersWrap.className = 'col-headers-wrap';

  const dayLetters = ['S','M','T','W','T','F','S'];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // For today's-column highlight — compare stamps, not Date objects.
  const todayStamp = (() => {
    const t = new Date(); t.setHours(0,0,0,0);
    const wd = t.getDay();
    // If weekend, stand in on Friday
    if (wd === 0) t.setDate(t.getDate() - 2); // Sun → Fri
    else if (wd === 6) t.setDate(t.getDate() - 1); // Sat → Fri
    return t.getTime();
  })();
  const isToday = (d) => { const c = new Date(d); c.setHours(0,0,0,0); return c.getTime() === todayStamp; };

  // --- Row 1: Months ---
  const monthRow = document.createElement('div');
  monthRow.className = 'col-headers month-header-row';
  const monthSpacer = renderMapControls();
  monthRow.appendChild(monthSpacer);

  let c = 0;
  while (c < TOTAL_COLS) {
    const d = colToDate(c);
    const thisMonth = d.getMonth();
    const thisYear = d.getFullYear();
    let span = 0;
    while (c + span < TOTAL_COLS) {
      const d2 = colToDate(c + span);
      if (d2.getMonth() !== thisMonth || d2.getFullYear() !== thisYear) break;
      span++;
    }
    // Highlight the month containing today
    let monthHasToday = false;
    for (let k = 0; k < span; k++) {
      if (isToday(colToDate(c + k))) { monthHasToday = true; break; }
    }
    const monthEl = document.createElement('div');
    monthEl.className = 'month-span';
    monthEl.style.width = (span * dayPx()) + 'px';
    monthEl.style.minWidth = (span * dayPx()) + 'px';
    const monthLabel = monthNames[thisMonth] + ' ' + thisYear;
    if (monthHasToday) {
      monthEl.innerHTML = `<span class="today-bubble">${monthLabel}</span>`;
    } else {
      monthEl.textContent = monthLabel;
    }
    monthRow.appendChild(monthEl);
    c += span;
  }
  headersWrap.appendChild(monthRow);

  // --- Row 2: Weeks (w/c date) — hidden in month view ---
  if (zoom !== 'month') {
    const weekRow = document.createElement('div');
    weekRow.className = 'col-headers';
    const weekSpacer = document.createElement('div');
    weekSpacer.className = 'row-header-spacer';
    weekRow.appendChild(weekSpacer);

    c = 0;
    while (c < TOTAL_COLS) {
      const d = colToDate(c);
      // Find start of this week (Monday)
      let span = 0;
      const weekDay = d.getDay();
      // Count days until next Monday or end
      while (c + span < TOTAL_COLS) {
        const d2 = colToDate(c + span);
        if (span > 0 && d2.getDay() === 1) break;
        span++;
      }
      // Highlight the week containing today
      let weekHasToday = false;
      for (let k = 0; k < span; k++) {
        if (isToday(colToDate(c + k))) { weekHasToday = true; break; }
      }
      const weekEl = document.createElement('div');
      weekEl.className = 'week-span';
      weekEl.style.width = (span * dayPx()) + 'px';
      weekEl.style.minWidth = (span * dayPx()) + 'px';
      // Find the Monday of this week
      const monday = new Date(d);
      monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
      const weekLabel = 'w/c ' + formatDate(monday);
      if (weekHasToday) {
        weekEl.innerHTML = `<span class="today-bubble">${weekLabel}</span>`;
      } else {
        weekEl.textContent = weekLabel;
      }
      weekRow.appendChild(weekEl);
      c += span;
    }
    headersWrap.appendChild(weekRow);
  }

  // --- Rows 3 & 4: Day letters + date numbers (day-like views only) ---
  if (isDayLikeZoom()) {
    const dayRow = document.createElement('div');
    dayRow.className = 'col-headers';
    const daySpacer = document.createElement('div');
    daySpacer.className = 'row-header-spacer';
    dayRow.appendChild(daySpacer);

    const dateRow = document.createElement('div');
    dateRow.className = 'col-headers';
    const dateSpacer = document.createElement('div');
    dateSpacer.className = 'row-header-spacer';
    dateRow.appendChild(dateSpacer);

    // Walk dates once, populate both rows in one pass via fragments.
    const dayFrag = document.createDocumentFragment();
    const dateFrag = document.createDocumentFragment();
    const walker = new Date(projectStart);
    for (let c = 0; c < TOTAL_COLS; c++) {
      // Skip weekends
      while (walker.getDay() === 0 || walker.getDay() === 6) walker.setDate(walker.getDate() + 1);
      const today = isToday(walker);
      const dayCh = document.createElement('div');
      dayCh.className = 'col-header';
      dayCh.style.width = dayPx() + 'px';
      dayCh.style.minWidth = dayPx() + 'px';
      dayCh.textContent = dayLetters[walker.getDay()];
      dayFrag.appendChild(dayCh);

      const dateCh = document.createElement('div');
      dateCh.className = 'col-header';
      dateCh.style.width = dayPx() + 'px';
      dateCh.style.minWidth = dayPx() + 'px';
      if (today) {
        dateCh.innerHTML = `<span class="today-bubble">${walker.getDate()}</span>`;
      } else {
        dateCh.textContent = walker.getDate();
      }
      dateFrag.appendChild(dateCh);

      walker.setDate(walker.getDate() + 1);
    }
    dayRow.appendChild(dayFrag);
    dateRow.appendChild(dateFrag);
    headersWrap.appendChild(dayRow);
    headersWrap.appendChild(dateRow);

    if (zoom === 'day-half') {
      const halfRow = document.createElement('div');
      halfRow.className = 'col-headers';
      const halfSpacer = document.createElement('div');
      halfSpacer.className = 'row-header-spacer';
      halfRow.appendChild(halfSpacer);
      const halfFrag = document.createDocumentFragment();
      for (let c = 0; c < TOTAL_COLS; c++) {
        ['AM', 'PM'].forEach(label => {
          const halfCh = document.createElement('div');
          halfCh.className = 'col-header';
          halfCh.style.width = (dayPx() / 2) + 'px';
          halfCh.style.minWidth = (dayPx() / 2) + 'px';
          halfCh.textContent = label;
          halfFrag.appendChild(halfCh);
        });
      }
      halfRow.appendChild(halfFrag);
      headersWrap.appendChild(halfRow);
    }
  }

  wrapper.appendChild(headersWrap);

  // Resources. Each track is rendered as a real grid row, grouped under one resource header.
  rows.forEach(row => {
    const group = document.createElement('div');
    group.className = 'resource-group';
    group.dataset.rowId = row.id;
    group.style.setProperty('--row-h', getResourceGroupHeight(row) + 'px');

    const resourceResize = document.createElement('div');
    resourceResize.className = 'row-resize resource-row-resize';
    resourceResize.title = 'Drag to resize all tracks in this resource. Hold Shift to apply to all resources.';
    resourceResize.addEventListener('pointerdown', (e) => startRowResize(e, row.id));
    group.appendChild(resourceResize);

    const header = document.createElement('div');
    header.className = 'row-header resource-group-header';
    header.appendChild(makeHeaderResizeHandle());

    const headerMain = document.createElement('div');
    headerMain.className = 'row-header-main';

    const gridHandle = document.createElement('div');
    gridHandle.className = 'row-drag-handle';
    gridHandle.textContent = '⠿';
    gridHandle.title = 'Drag to reorder resource';
    if (typeof Sortable === 'undefined') gridHandle.addEventListener('mousedown', (e) => startRowDrag(e, row.id, 'grid'));
    headerMain.appendChild(gridHandle);

    const summary = document.createElement('div');
    summary.className = 'resource-summary';
    summary.appendChild(makeSummaryResizeHandle());

    const input = document.createElement('input');
    input.className = 'row-label-input';
    input.maxLength = RESOURCE_NAME_MAX_CHARS;
    input.placeholder = 'Resource ' + row.id;
    input.value = clampResourceName(row.label);
    input.oninput = (e) => {
      e.target.value = clampResourceName(e.target.value);
      row.label = e.target.value;
      applyHeaderWidth();
      renderPanel();
      saveState();
    };
    summary.appendChild(input);

    const capacityWrap = document.createElement('span');
    capacityWrap.className = 'capacity-control';
    capacityWrap.title = 'Row capacity: lower capacity makes blocks longer (e.g. 50% doubles duration)';
    capacityWrap.appendChild(document.createTextNode('Capacity:'));
    const capacityInput = document.createElement('input');
    capacityInput.type = 'number';
    capacityInput.className = 'capacity-input';
    capacityInput.min = '1';
    capacityInput.max = '999';
    capacityInput.value = getRowCapacity(row);
    capacityInput.addEventListener('mousedown', e => e.stopPropagation());
    capacityInput.addEventListener('click', e => e.stopPropagation());
    capacityInput.addEventListener('change', (e) => setRowCapacity(row, e.target.value));
    capacityWrap.appendChild(capacityInput);
    capacityWrap.appendChild(document.createTextNode('%'));
    summary.appendChild(capacityWrap);
    summary.appendChild(buildTagsRow(row));

    const deleteResourceBtn = document.createElement('button');
    deleteResourceBtn.className = 'resource-delete-btn';
    deleteResourceBtn.type = 'button';
    deleteResourceBtn.title = 'Delete resource';
    deleteResourceBtn.textContent = '×';
    deleteResourceBtn.addEventListener('mousedown', e => e.stopPropagation());
    deleteResourceBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteResource(row.id); });
    header.appendChild(deleteResourceBtn);
    headerMain.appendChild(summary);

    const trackPanel = document.createElement('div');
    trackPanel.className = 'track-panel';
    trackPanel.appendChild(buildTrackList(row));
    headerMain.appendChild(trackPanel);

    header.appendChild(headerMain);
    group.appendChild(header);

    const trackStack = document.createElement('div');
    trackStack.className = 'resource-track-stack';

    const trackCells = new Map();
    const rowTracks = getRowTracks(row);
    rowTracks.forEach((track, idx) => {
      const trackRow = document.createElement('div');
      trackRow.className = 'row track-grid-row';
      trackRow.dataset.rowId = row.id;
      trackRow.dataset.trackId = track.id;
      trackRow.style.setProperty('--row-h', (track.height || ROW_H_DEFAULT) + 'px');

      const cells = document.createElement('div');
      cells.className = 'row-cells track-row-cells';
      cells.dataset.rowId = row.id;
      cells.dataset.trackId = track.id;
      if (zoom === 'month') cells.classList.add('painted-month');
      else {
        cells.classList.add(zoom === 'week' ? 'painted-week' : 'painted-day');
        if (isDayLikeZoom()) {
          const px = dayPx();
          cells.style.backgroundImage = zoom === 'day-half'
            ? `repeating-linear-gradient(to right, transparent 0, transparent ${px / 2 - 1}px, rgba(180,180,180,0.45) ${px / 2 - 1}px, rgba(180,180,180,0.45) ${px / 2}px, transparent ${px / 2}px, transparent ${px - 1}px, var(--grid-line) ${px - 1}px, var(--grid-line) ${px}px)`
            : `repeating-linear-gradient(to right, transparent 0, transparent ${px - 1}px, var(--grid-line) ${px - 1}px, var(--grid-line) ${px}px)`;
        }
        if (zoom === 'week') {
          let firstWeekDays = 0;
          for (let wc = 0; wc < TOTAL_COLS; wc++) {
            if (wc > 0 && colToDate(wc).getDay() === 1) break;
            firstWeekDays++;
          }
          cells.style.backgroundPositionX = (firstWeekDays * WEEK_DAY_PX - 79) + 'px';
        }
      }
      cells.style.width = (TOTAL_COLS * dayPx()) + 'px';
      cells.style.minWidth = (TOTAL_COLS * dayPx()) + 'px';

      cells.addEventListener('dblclick', (e) => {
        if (e.target.closest('.block')) return;
        const rect = cells.getBoundingClientRect();
        const x = e.clientX - rect.left + cells.scrollLeft;
        const col = Math.floor(x / dayPx());
        createBlock(row.id, col, 3, '', false, 'grid', track.id);
      });

      cells.addEventListener('mousedown', (e) => {
        if (e.target.closest('.block') || e.target.closest('.row-resize')) return;
        if (e.button !== 0) return;
        const rect = cells.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const col = Math.floor(x / dayPx());
        const preview = document.createElement('div');
        preview.className = 'create-preview';
        preview.style.left = (col * dayPx()) + 'px';
        preview.style.width = dayPx() + 'px';
        cells.appendChild(preview);
        createState = { rowId: row.id, trackId: track.id, startCol: col, currentCol: col, preview };
      });

      trackRow.appendChild(cells);

      // Drag the line dividing this track from the next to resize this track,
      // mirroring the resource-level resize handle. Skip the bottom-most edge
      // when it coincides with the resource resize handle (no add row below).
      if (idx < rowTracks.length - 1 || canAddTrack(row)) {
        const trackResize = document.createElement('div');
        trackResize.className = 'row-resize track-row-resize';
        trackResize.title = 'Drag to resize this track';
        trackResize.addEventListener('pointerdown', (e) => startTrackResize(e, row.id, track.id));
        trackRow.appendChild(trackResize);
      }

      trackStack.appendChild(trackRow);
      trackCells.set(track.id, cells);
    });

    if (canAddTrack(row)) {
      const addLane = document.createElement('div');
      addLane.className = 'row track-grid-row track-add-lane';
      addLane.dataset.rowId = row.id;
      addLane.title = 'Add a track to this resource';
      addLane.style.setProperty('--row-h', ADD_TRACK_ROW_H + 'px');
      addLane.addEventListener('click', (e) => { if (e.target.closest('.block')) return; addTrack(row); });
      const addCells = document.createElement('div');
      addCells.className = 'row-cells track-row-cells';
      addCells.style.width = (TOTAL_COLS * dayPx()) + 'px';
      addCells.style.minWidth = (TOTAL_COLS * dayPx()) + 'px';
      addLane.appendChild(addCells);
      trackStack.appendChild(addLane);
    }

    const rowBlocks = blocks.filter(b => b.rowId === row.id);
    rowBlocks.forEach(block => {
      const cells = trackCells.get(block.trackId) || trackCells.get(getDefaultTrackId(row));
      if (!cells) return;
      const bEl = document.createElement('div');
      const renderTrackId = cells.dataset.trackId || block.trackId;
      const renderTrack = rowTracks.find(track => track.id === renderTrackId);
      const compactClass = ((renderTrack?.height || ROW_H_DEFAULT) <= BLOCK_COMPACT_ROW_H) ? ' block-compact' : '';
      bEl.className = `block block-color-${block.color}${isDataBlock(block) ? ' block-data' : ''}${compactClass}`;
      const baseDuration = getBlockBaseDuration(block);
      const capacityDays = Math.max(0, block.duration - baseDuration);
      bEl.style.left = (block.start * dayPx()) + 'px';
      bEl.style.width = (baseDuration * dayPx() - 2) + 'px';
      bEl.dataset.blockId = block.id;

      const labelEl = document.createElement('span');
      labelEl.className = 'block-label';
      labelEl.textContent = block.label || '';
      bEl.appendChild(labelEl);

      const daysBadge = document.createElement('span');
      daysBadge.className = 'block-days-badge';
      daysBadge.innerHTML = fmtBlockDuration(block);
      bEl.appendChild(daysBadge);

      if (!isDataBlock(block)) {
        const hl = document.createElement('div');
        hl.className = 'handle-left';
        hl.addEventListener('mousedown', (e) => startResize(e, block.id, 'left'));
        bEl.appendChild(hl);

        const hr = document.createElement('div');
        hr.className = 'handle-right';
        hr.addEventListener('mousedown', (e) => startResize(e, block.id, 'right'));
        bEl.appendChild(hr);

        bEl.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('handle-left') || e.target.classList.contains('handle-right')) return;
          if (e.target.classList.contains('block-label-input')) return;
          startMove(e, block.id);
        });
      }

      bEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showBlockContextMenu(e, block.id);
      });

      bEl.addEventListener('click', (e) => {
        if (isDataBlock(block)) return;
        if (e.target.classList.contains('handle-left') || e.target.classList.contains('handle-right')) return;
        if (e.target.classList.contains('block-label-input')) return;
        const now = Date.now();
        if (now - (block._lastClickAt || 0) < 400) {
          e.stopPropagation();
          block._lastClickAt = 0;
          startEditingBlockLabel(bEl, labelEl, block);
        } else {
          block._lastClickAt = now;
        }
      });

      cells.appendChild(bEl);

      const extraDays = contingencyPct > 0 ? Math.round(block.duration * contingencyPct / 100) : 0;
      const baseExtraDays = contingencyPct > 0 ? Math.round(baseDuration * contingencyPct / 100) : 0;
      const capacityExtraDays = Math.max(0, extraDays - baseExtraDays);

      if (baseExtraDays > 0) {
        const cEl = document.createElement('div');
        cEl.className = `block-contingency block-color-${block.color}`;
        cEl.dataset.contingencyFor = block.id;
        cEl.style.left = (baseDuration * dayPx() - 2) + 'px';
        cEl.style.width = (baseExtraDays * dayPx()) + 'px';
        bEl.appendChild(cEl);
      }

      const capacityVisualDays = capacityDays + capacityExtraDays;
      if (capacityVisualDays > 0) {
        const capEl = document.createElement('div');
        capEl.className = 'capacity-block';
        capEl.dataset.capacityFor = block.id;
        capEl.style.left = ((block.start + baseDuration + baseExtraDays) * dayPx()) + 'px';
        capEl.style.width = (capacityVisualDays * dayPx() - 2) + 'px';
        cells.appendChild(capEl);
      }
    });

    group.appendChild(trackStack);
    wrapper.appendChild(group);
  });

  // Add row button — structured as a row so the left label stays sticky with other headers
  const addRowWrapper = document.createElement('div');
  addRowWrapper.className = 'row';
  addRowWrapper.style.height = '32px';

  const addRowHeader = document.createElement('div');
  addRowHeader.className = 'row-header add-row-btn';
  addRowHeader.textContent = '+ Add row';
  addRowHeader.onclick = () => {
    rows.push(makeRow(nextRowId++));
    render();
  };
  addRowWrapper.appendChild(addRowHeader);

  const addRowCells = document.createElement('div');
  addRowCells.style.flex = '1';
  addRowCells.style.height = '32px';
  if (zoom !== 'month') {
    addRowCells.style.width = (TOTAL_COLS * dayPx()) + 'px';
    addRowCells.style.minWidth = (TOTAL_COLS * dayPx()) + 'px';
  }
  addRowWrapper.appendChild(addRowCells);

  wrapper.appendChild(addRowWrapper);

  applyRowHeights();
  schedulePostRenderWork();
}

let _gridRowSortable = null;
let _trackSortables = [];
function setupGridRowSortable() {
  const wrapper = document.getElementById('grid-wrapper');
  if (!wrapper || typeof Sortable === 'undefined') return;
  if (_gridRowSortable) {
    _gridRowSortable.destroy();
    _gridRowSortable = null;
  }
  _gridRowSortable = Sortable.create(wrapper, {
    draggable: '.resource-group[data-row-id]',
    handle: '.row-header-main > .row-drag-handle',
    animation: 180,
    ghostClass: 'row-sortable-ghost',
    chosenClass: 'row-sortable-chosen',
    dragClass: 'row-sortable-drag',
    fallbackOnBody: true,
    swapThreshold: 0.65,
    onStart() {
      document.body.classList.add('row-reordering-sortable');
    },
    onEnd() {
      document.body.classList.remove('row-reordering-sortable');
      const addRowEl = wrapper.querySelector('.add-row-btn')?.closest('.row');
      if (addRowEl) wrapper.appendChild(addRowEl);
      const orderedIds = [...wrapper.querySelectorAll('.resource-group[data-row-id]')].map(el => parseInt(el.dataset.rowId));
      if (orderedIds.length !== rows.length) return;
      const byId = new Map(rows.map(row => [row.id, row]));
      const nextRows = orderedIds.map(id => byId.get(id)).filter(Boolean);
      if (nextRows.length !== rows.length) return;
      const changed = nextRows.some((row, idx) => row.id !== rows[idx].id);
      if (!changed) return;
      rows = nextRows;
      renderPanel();
      saveState();
    },
  });
}

function setupTrackSortables() {
  _trackSortables.forEach(sortable => sortable.destroy());
  _trackSortables = [];
  if (typeof Sortable === 'undefined') return;
  document.querySelectorAll('.track-list[data-row-id]').forEach(list => {
    const rowId = parseInt(list.dataset.rowId);
    const row = rows.find(r => r.id === rowId);
    if (!row) return;
    _trackSortables.push(Sortable.create(list, {
      draggable: '.track-label-row',
      handle: '.track-drag-handle',
      animation: 180,
      ghostClass: 'row-sortable-ghost',
      chosenClass: 'row-sortable-chosen',
      dragClass: 'row-sortable-drag',
      fallbackOnBody: true,
      swapThreshold: 0.65,
      preventOnFilter: false,
      filter: '.track-delete-btn',
      onStart() {
        document.body.classList.add('row-reordering-sortable');
      },
      onEnd() {
        document.body.classList.remove('row-reordering-sortable');
        const orderedIds = [...list.querySelectorAll('.track-label-row[data-track-id]')].map(el => el.dataset.trackId);
        const byId = new Map(getRowTracks(row).map(track => [track.id, track]));
        const nextTracks = orderedIds.map(id => byId.get(id)).filter(Boolean);
        if (nextTracks.length !== row.tracks.length) return;
        row.tracks = nextTracks;
        render();
        saveState();
      },
    }));
  });
}

// --- Panel inline editing ---
function startEditingPanelRowLabel(labelSpan, row) {
  if (labelSpan.querySelector('input')) return;
  const prev = row.label;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'panel-name-input';
  input.maxLength = RESOURCE_NAME_MAX_CHARS;
  input.value = clampResourceName(row.label);
  input.placeholder = 'Row ' + row.id;
  input.addEventListener('mousedown', e => e.stopPropagation());
  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('dblclick', e => e.stopPropagation());
  labelSpan.textContent = '';
  labelSpan.appendChild(input);
  requestAnimationFrame(() => { input.focus(); input.select(); });

  let done = false;
  const finish = (commit) => {
    if (done) return;
    done = true;
    if (commit) row.label = clampResourceName(input.value.trim());
    labelSpan.textContent = row.label || 'Row ' + row.id;
    if (commit && row.label !== prev) {
      saveState();
      // Sync grid row header input
      const gridInput = document.querySelector(`.resource-group[data-row-id="${row.id}"] .row-header .row-label-input`);
      if (gridInput) gridInput.value = row.label;
      applyHeaderWidth();
    }
  };
  input.addEventListener('blur', () => finish(true));
  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
}

function startEditingPanelBlockLabel(nameSpan, block) {
  if (nameSpan.querySelector('input')) return;
  const prev = block.label;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'panel-name-input';
  input.value = block.label || '';
  input.placeholder = 'Untitled';
  input.addEventListener('mousedown', e => e.stopPropagation());
  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('dblclick', e => e.stopPropagation());
  nameSpan.textContent = '';
  nameSpan.appendChild(input);
  requestAnimationFrame(() => { input.focus(); input.select(); });

  let done = false;
  const finish = (commit) => {
    if (done) return;
    done = true;
    if (commit) block.label = input.value.trim();
    nameSpan.textContent = block.label || 'Untitled';
    if (commit && block.label !== prev) {
      saveState();
      // Sync grid block label without full re-render
      const gridLabel = document.querySelector(`[data-block-id="${block.id}"] .block-label`);
      if (gridLabel) gridLabel.textContent = block.label;
    }
  };
  input.addEventListener('blur', () => finish(true));
  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
}

function renderPanel() {
  const stats = document.getElementById('panel-stats');
  const list = document.getElementById('panel-blocks');
  if (!stats) return;
  const totalBlocks = blocks.length;
  const rowsUsed = new Set(blocks.map(b => b.rowId)).size;

  const totalDays = blocks.reduce((s, b) => s + getBlockBaseDuration(b), 0);
  const scheduledDays = blocks.reduce((s, b) => s + b.duration, 0);
  const contingencyDays = contingencyPct > 0 ? blocks.reduce((s, b) => s + Math.round(b.duration * contingencyPct / 100), 0) : 0;
  const scheduledLine = scheduledDays !== totalDays
    ? `<div class="panel-stat"><span class="label">Capacity-adjusted Days</span><span class="value capacity-adjusted">${scheduledDays}d</span></div>`
    : '';

  stats.innerHTML = `
    <div class="panel-stat"><span class="label">Base Days</span><span class="value" style="color:var(--text)">${totalDays}<span class="cg">d</span></span></div>
    ${scheduledLine}
    <div class="panel-stat"><span class="label">Contingency Days @ ${contingencyPct}%</span><span class="value" style="color:var(--text)">+${contingencyDays}d</span></div>
    <div class="panel-stat"><span class="label">Total Days</span><span class="value" style="color:var(--text)">${fmtDays(scheduledDays, contingencyDays)}</span></div>
    <div class="panel-stat"><span class="label">Active Rows</span><span class="value">${rowsUsed}</span></div>
    <div class="panel-stat"><span class="label">Total Blocks</span><span class="value">${totalBlocks}</span></div>
  `;

  if (!list) return;
  list.innerHTML = '';

  // Group blocks by row
  rows.forEach(row => {
    const rowBlocks = blocks.filter(b => b.rowId === row.id);
    if (rowBlocks.length === 0) return;

    const rowDays = rowBlocks.reduce((s, b) => s + getBlockBaseDuration(b), 0);
    const rowScheduledDays = rowBlocks.reduce((s, b) => s + b.duration, 0);
    const rowContingency = contingencyPct > 0 ? rowBlocks.reduce((s, b) => s + Math.round(b.duration * contingencyPct / 100), 0) : 0;

    // Section header (collapsible)
    const isCollapsed = !!collapsedRows[row.id];
    const section = document.createElement('div');
    section.className = 'panel-section-header' + (isCollapsed ? ' collapsed' : '');
    section.dataset.rowId = row.id;

    const panelHandle = document.createElement('div');
    panelHandle.className = 'row-drag-handle';
    panelHandle.textContent = '⠿';
    panelHandle.title = 'Drag to reorder';
    panelHandle.addEventListener('mousedown', (e) => startRowDrag(e, row.id, 'panel'));
    section.appendChild(panelHandle);

    const sectionTitle = document.createElement('span');
    sectionTitle.className = 'section-title';

    const caret = document.createElement('span');
    caret.className = 'caret';
    caret.textContent = '▼';
    sectionTitle.appendChild(caret);

    const rowLabelSpan = document.createElement('span');
    rowLabelSpan.className = 'panel-row-label';
    rowLabelSpan.textContent = row.label || 'Row ' + row.id;
    rowLabelSpan.title = 'Double-click to rename';
    rowLabelSpan.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      startEditingPanelRowLabel(rowLabelSpan, row);
    });
    sectionTitle.appendChild(rowLabelSpan);

    const sectionDays = document.createElement('span');
    sectionDays.className = 'section-days-3col';
    const totalRowDays = rowScheduledDays + rowContingency;
    sectionDays.innerHTML = `<span class="sec-base">${getRowCapacity(row)}% · ${rowDays}d${rowScheduledDays !== rowDays ? ` <span class="capacity-adjusted">(${rowScheduledDays}d)</span>` : ''}</span><span class="sec-conting">+${rowContingency}d</span><span class="sec-total">${totalRowDays}d</span>`;

    section.appendChild(sectionTitle);
    section.appendChild(sectionDays);

    section.addEventListener('click', (e) => {
      if (e.target.closest('.panel-row-label') || e.target.tagName === 'INPUT') return;
      if (e.target.closest('.row-drag-handle')) return;
      if (collapsedRows[row.id]) delete collapsedRows[row.id];
      else collapsedRows[row.id] = true;
      renderPanel();
      saveState();
    });
    list.appendChild(section);

    // Body container for this row's blocks
    const body = document.createElement('div');
    body.className = 'panel-section-body' + (isCollapsed ? ' collapsed' : '');
    list.appendChild(body);

    // Blocks in this row
    rowBlocks.forEach(block => {
      const startDate = formatDate(colToDate(block.start));
      const endDate = formatDate(colToDate(block.start + block.duration - 1));

      const extraDays = contingencyPct > 0 ? Math.round(block.duration * contingencyPct / 100) : 0;

      const item = document.createElement('div');
      item.className = 'panel-block-item';

      const nameRow = document.createElement('div');
      nameRow.className = 'block-name';

      const dot = document.createElement('span');
      dot.className = `block-dot block-color-${block.color}`;

      const nameSpan = document.createElement('span');
      nameSpan.className = 'panel-block-name-text';
      nameSpan.textContent = block.label || 'Untitled';
      nameSpan.title = 'Double-click to rename';
      nameSpan.style.flex = '1';
      nameSpan.style.minWidth = '0';
      nameSpan.style.overflow = 'hidden';
      nameSpan.style.textOverflow = 'ellipsis';
      nameSpan.style.whiteSpace = 'nowrap';
      nameSpan.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        startEditingPanelBlockLabel(nameSpan, block);
      });

      const daysSpan = document.createElement('span');
      daysSpan.className = 'block-days';
      daysSpan.innerHTML = fmtBlockDuration(block);

      nameRow.appendChild(dot);
      nameRow.appendChild(nameSpan);
      nameRow.appendChild(daysSpan);

      const metaDiv = document.createElement('div');
      metaDiv.className = 'block-meta';
      const track = getTrack(row, block.trackId);
      metaDiv.textContent = `${track?.label || 'Track'} · ${startDate} → ${endDate}`;

      item.appendChild(nameRow);
      item.appendChild(metaDiv);

      item.addEventListener('click', (e) => {
        if (e.target.tagName === 'INPUT') return;
        const gridArea = document.getElementById('grid-area');
        gridArea.scrollLeft = block.start * dayPx() - 200;
      });
      body.appendChild(item);
    });

    // Row totals bar
    const totals = document.createElement('div');
    totals.className = 'section-totals';
    totals.innerHTML = `
      <span class="totals-label">Total</span>
      <span class="totals-col totals-base">${rowDays}d</span>
      <span class="totals-col totals-conting">+${rowContingency}d</span>
      <span class="totals-col totals-total">${totalRowDays}d</span>
    `;
    body.appendChild(totals);
  });
}

// --- Row vertical resize ---
function resourceNameMinWidth() {
  const sampleInput = document.querySelector('.row-label-input');
  const font = sampleInput ? getComputedStyle(sampleInput).font : '15px Inter, sans-serif';
  const canvas = resourceNameMinWidth._canvas || (resourceNameMinWidth._canvas = document.createElement('canvas'));
  const ctx = canvas.getContext('2d');
  ctx.font = font;
  const widest = rows.reduce((max, row) => {
    const label = clampResourceName(row.label) || `Resource ${row.id}`;
    return Math.max(max, ctx.measureText(label).width);
  }, 0);
  // Include summary left/right padding plus a small caret/breathing allowance.
  return Math.ceil(widest + 30);
}

function clampResourceSummaryWidth() {
  const minForName = Math.max(SUMMARY_W_MIN, resourceNameMinWidth());
  headerWidth = Math.max(headerWidth, minForName + TRACK_PANEL_MIN_W);
  const maxForHeader = Math.max(minForName, headerWidth - TRACK_PANEL_MIN_W);
  resourceSummaryWidth = Math.max(minForName, Math.min(SUMMARY_W_MAX, maxForHeader, Math.round(resourceSummaryWidth)));
}

function applyHeaderWidth() {
  headerWidth = Math.max(HEADER_W_MIN, Math.min(HEADER_W_MAX, Math.round(headerWidth)));
  clampResourceSummaryWidth();
  document.documentElement.style.setProperty('--row-header-width', headerWidth + 'px');
  document.documentElement.style.setProperty('--resource-summary-width', resourceSummaryWidth + 'px');
}

// Shared drag binding for every resize handle. Uses Pointer Events end-to-end:
// mixing mousedown with pointerdown (as the old handlers did) makes the browser
// suppress the compat mouse events the move/up listeners were waiting on, which
// silently wedged the handles. Pointer capture-free window listeners plus
// pointercancel guarantee the drag always cleans up — no stuck "active" flags.
function beginPointerDrag(e, { onMove, onEnd, cursorClass } = {}) {
  if (e.button != null && e.button > 0) return false; // primary button / touch only
  e.preventDefault();
  e.stopPropagation();
  const startX = e.clientX, startY = e.clientY;
  if (cursorClass) document.body.classList.add(cursorClass);
  const move = (ev) => { if (onMove) onMove(ev.clientX - startX, ev.clientY - startY, ev); };
  const end = (ev) => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', end);
    window.removeEventListener('pointercancel', end);
    if (cursorClass) document.body.classList.remove(cursorClass);
    if (onEnd) onEnd(ev);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  return true;
}

// Drag the divider on the right edge of the full left header column to resize it.
function startHeaderResize(e) {
  const startW = headerWidth;
  const startSummaryW = resourceSummaryWidth;
  const handle = e.currentTarget;
  const started = beginPointerDrag(e, {
    cursorClass: 'col-resizing',
    onMove(dx) {
      headerWidth = startW + dx;
      resourceSummaryWidth = startSummaryW * (headerWidth / Math.max(1, startW));
      applyHeaderWidth();
      applyRowHeights();
    },
    onEnd() { handle?.classList?.remove('dragging'); saveState(); },
  });
  if (!started) return;
  handle?.classList?.add('dragging');
}

function startSummaryResize(e) {
  const startW = resourceSummaryWidth;
  const handle = e.currentTarget;
  const started = beginPointerDrag(e, {
    cursorClass: 'col-resizing',
    onMove(dx) {
      resourceSummaryWidth = startW + dx;
      applyHeaderWidth();
      applyRowHeights();
    },
    onEnd() { handle?.classList?.remove('dragging'); saveState(); },
  });
  if (!started) return;
  handle?.classList?.add('dragging');
}

function makeHeaderResizeHandle() {
  const h = document.createElement('div');
  h.className = 'header-col-resize';
  h.title = 'Drag to resize the resource header column';
  h.addEventListener('pointerdown', startHeaderResize);
  return h;
}

function makeSummaryResizeHandle() {
  const h = document.createElement('div');
  h.className = 'summary-col-resize';
  h.title = 'Drag to resize the resource name/tags column';
  h.addEventListener('pointerdown', startSummaryResize);
  return h;
}

function setBlocksCompactForTrack(trackId, trackHeight) {
  document.querySelectorAll(`.track-row-cells[data-track-id="${trackId}"] .block`).forEach(blockEl => {
    blockEl.classList.toggle('block-compact', trackHeight <= BLOCK_COMPACT_ROW_H);
  });
}

function applyRowHeights() {
  rows.forEach(row => {
    const rowEl = document.querySelector(`.resource-group[data-row-id="${row.id}"]`);
    if (!rowEl) return;
    const renderedH = Math.max(getResourceGroupHeight(row), getResourceContentMinHeight(row));
    rowEl.style.setProperty('--row-h', renderedH + 'px');
    rowEl.style.minHeight = renderedH + 'px';

    getRowTracks(row).forEach(track => {
      const h = track.height || ROW_H_DEFAULT;
      document.querySelectorAll(`[data-track-id="${track.id}"]`).forEach(el => {
        el.style.setProperty('--track-h', h + 'px');
        if (el.classList.contains('track-grid-row')) el.style.setProperty('--row-h', h + 'px');
      });
      setBlocksCompactForTrack(track.id, h);
    });
  });
}

// --- Block operations ---
function createBlock(rowId, startCol, duration, label, durationIsScheduled = false, kind = 'grid', trackId = null) {
  const row = rows.find(r => r.id === rowId);
  const resolvedTrackId = trackId || getDefaultTrackId(row);
  const inputDuration = duration || 3;
  const baseDuration = durationIsScheduled ? adjustedDurationForCapacity(inputDuration, getRowCapacity(row), 100) : inputDuration;
  const scheduledDuration = adjustedDurationForCapacity(baseDuration, 100, getRowCapacity(row));
  const block = {
    id: nextBlockId++,
    rowId,
    trackId: resolvedTrackId,
    start: startCol,
    baseDuration,
    duration: scheduledDuration,
    label: label || '',
    kind: kind === 'data' ? 'data' : 'grid',
    color: (nextBlockId - 2) % COLORS,
  };
  blocks.push(block);
  render();
  saveState();
  return block;
}

function deleteBlock(id) {
  blocks = blocks.filter(b => b.id !== id);
  render();
  saveState();
}

function deleteResource(rowId) {
  const row = rows.find(r => r.id === rowId);
  if (!row) return;
  const resourceName = row.label || `Resource ${row.id}`;
  const blockCount = blocks.filter(b => b.rowId === rowId).length;
  const detail = blockCount ? ` This will also delete ${blockCount} block${blockCount === 1 ? '' : 's'} assigned to it.` : '';
  if (!confirm(`Delete resource "${resourceName}"?${detail}`)) return;
  rows = rows.filter(r => r.id !== rowId);
  blocks = blocks.filter(b => b.rowId !== rowId);
  delete rowHeights[rowId];
  delete collapsedRows[rowId];
  if (!rows.length) rows.push(makeRow(nextRowId++));
  render();
  renderPanel();
  saveState();
}

// --- Inline block label edit (real <input> swap, autosaves on commit) ---
function startEditingBlockLabel(bEl, labelEl, block) {
  // Already editing? bail.
  if (bEl.querySelector('.block-label-input')) return;

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'block-label-input';
  input.value = block.label || '';
  // Stop drag/dblclick handlers from interfering with the input
  input.addEventListener('mousedown', (e) => e.stopPropagation());
  input.addEventListener('dblclick', (e) => e.stopPropagation());
  input.addEventListener('click', (e) => e.stopPropagation());

  labelEl.style.display = 'none';
  bEl.insertBefore(input, labelEl);

  // Defer focus to next frame so the dblclick selection / drag preventDefault
  // doesn't steal it back.
  requestAnimationFrame(() => {
    input.focus();
    input.select();
  });

  let done = false;
  const finish = (commit) => {
    if (done) return;
    done = true;
    if (commit) {
      const next = input.value.trim();
      if (next !== (block.label || '')) {
        block.label = next;
        saveState();
      }
      labelEl.textContent = block.label || '';
      renderPanel();
    }
    if (input.parentNode) input.parentNode.removeChild(input);
    labelEl.style.display = '';
  };

  input.addEventListener('blur', () => finish(true));
  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
}

// --- Row drag-to-reorder ---
function cssPx(value) {
  const n = parseFloat(value || 0);
  return Number.isFinite(n) ? n : 0;
}

function elementOuterHeight(el) {
  const cs = getComputedStyle(el);
  return elementRequiredHeight(el) + cssPx(cs.marginTop) + cssPx(cs.marginBottom);
}

function elementRequiredHeight(el) {
  if (el.classList && el.classList.contains('row-header-tags')) return wrappedTagsHeight(el);
  let h = Math.max(el.scrollHeight || 0, el.offsetHeight || 0);
  const kids = Array.from(el.children || []).filter(child => getComputedStyle(child).position !== 'absolute');
  if (kids.length) {
    const parentTop = el.getBoundingClientRect().top;
    let maxBottom = 0;
    kids.forEach(child => {
      const rect = child.getBoundingClientRect();
      maxBottom = Math.max(maxBottom, rect.bottom - parentTop);
    });
    h = Math.max(h, maxBottom);
  }
  return h;
}

function wrappedTagsHeight(tagsEl) {
  const children = Array.from(tagsEl.children || []).filter(child => getComputedStyle(child).position !== 'absolute');
  if (!children.length) return 0;
  const cs = getComputedStyle(tagsEl);
  const gap = cssPx(cs.columnGap || cs.gap) || 3;
  const rowGap = cssPx(cs.rowGap || cs.gap) || 3;
  const available = Math.max(1, tagsEl.clientWidth || tagsEl.getBoundingClientRect().width || resourceSummaryWidth);
  let rows = 1;
  let x = 0;
  let rowH = 0;
  let totalH = 0;
  children.forEach(child => {
    const w = Math.ceil(child.getBoundingClientRect().width || child.offsetWidth || 0);
    const h = Math.ceil(child.getBoundingClientRect().height || child.offsetHeight || 20);
    if (x > 0 && x + gap + w > available) {
      totalH += rowH + rowGap;
      rows++;
      x = 0;
      rowH = 0;
    }
    x += (x ? gap : 0) + w;
    rowH = Math.max(rowH, h);
  });
  totalH += rowH;
  return Math.max(totalH, Math.max(tagsEl.scrollHeight || 0, tagsEl.offsetHeight || 0));
}

function getResourceContentMinHeight(row) {
  const summary = document.querySelector(`.resource-group[data-row-id="${row.id}"] .resource-summary`);
  if (!summary) return RESOURCE_HEADER_MIN_H;
  // Keep enough resource height for wrapped name/capacity/tags content. Measure
  // direct children and explicitly calculate tag wrapping from chip widths.
  const styles = getComputedStyle(summary);
  const padY = cssPx(styles.paddingTop) + cssPx(styles.paddingBottom);
  const gap = cssPx(styles.rowGap || styles.gap) || 3;
  const children = Array.from(summary.children).filter(el => !el.classList.contains('summary-col-resize'));
  const childH = children.reduce((sum, el) => sum + elementOuterHeight(el), 0);
  const gaps = Math.max(0, children.length - 1) * gap;
  return Math.max(RESOURCE_HEADER_MIN_H, Math.ceil(padY + childH + gaps + 10));
}

function startRowResize(e, rowId) {
  const row = rows.find(r => r.id === rowId);
  if (!row || !getRowTracks(row).length) return;

  const startHeights = new Map(rows.map(r => [r.id, getRowTracks(r).map(t => t.height || ROW_H_DEFAULT)]));
  let resizeAll = e.shiftKey;
  const handle = e.currentTarget;
  const groupEl = document.querySelector(`.resource-group[data-row-id="${rowId}"]`);

  // Track heights are the single source of truth: move the combined track total
  // by the drag delta and distribute it across the tracks proportionally. The
  // header content height (name/capacity/tags) is a pure render-time floor in
  // getResourceGroupHeight/applyRowHeights — it must NOT feed back into this
  // math, or shrinking freezes and growing jumps.
  function applyDelta(targetRow, deltaY) {
    const targetTracks = getRowTracks(targetRow);
    const baseHeights = startHeights.get(targetRow.id) || targetTracks.map(t => t.height || ROW_H_DEFAULT);
    const count = Math.max(1, targetTracks.length);
    const baseTrackTotal = baseHeights.reduce((sum, h) => sum + (h || ROW_H_DEFAULT), 0);
    const targetTrackTotal = Math.max(ROW_H_MIN * count, Math.min(ROW_H_MAX * count, baseTrackTotal + deltaY));

    const scale = baseTrackTotal > 0 ? targetTrackTotal / baseTrackTotal : 1;
    let used = 0;
    targetTracks.forEach((track, idx) => {
      const isLast = idx === targetTracks.length - 1;
      const nextH = isLast ? targetTrackTotal - used : Math.round((baseHeights[idx] || ROW_H_DEFAULT) * scale);
      track.height = Math.max(ROW_H_MIN, Math.min(ROW_H_MAX, Math.round(nextH)));
      used += track.height;
    });
  }

  const started = beginPointerDrag(e, {
    cursorClass: 'row-resizing',
    onMove(dx, dy, ev) {
      if (ev.shiftKey) resizeAll = true;          // Shift = resize every resource
      if (resizeAll) rows.forEach(r => applyDelta(r, dy));
      else applyDelta(row, dy);
      applyRowHeights();
    },
    onEnd() {
      groupEl?.classList.remove('resizing');
      handle?.classList?.remove('dragging');
      render();
      saveState();
    },
  });
  if (!started) return;
  handle?.classList?.add('dragging');
  groupEl?.classList.add('resizing');
}

function startTrackResize(e, rowId, trackId) {
  const row = rows.find(r => r.id === rowId);
  const track = getTrack(row, trackId);
  if (!row || !track) return;
  const startH = track.height || ROW_H_DEFAULT;
  const handle = e.currentTarget;

  const started = beginPointerDrag(e, {
    cursorClass: 'row-resizing',
    onMove(dx, dy) {
      // Resize this track directly. The header-content floor is applied at render
      // time (applyRowHeights), so it must not constrain the stored track height.
      track.height = Math.max(ROW_H_MIN, Math.min(ROW_H_MAX, Math.round(startH + dy)));
      applyRowHeights();
    },
    onEnd() {
      handle?.classList?.remove('dragging');
      render();
      saveState();
    },
  });
  if (!started) return;
  handle?.classList?.add('dragging');
}

function startRowDrag(e, rowId, source) {
  e.preventDefault();
  e.stopPropagation();
  const fromIdx = rows.findIndex(r => r.id === rowId);
  if (fromIdx === -1) return;
  const rowEl = document.querySelector(`.row[data-row-id="${rowId}"]`);
  const rowH = rowEl ? (parseInt(rowEl.style.height) || rowEl.getBoundingClientRect().height) : 40;
  // Anchor the row to its exact pickup position in the document
  const rect = rowEl.getBoundingClientRect();
  rowEl.style.position = 'absolute';
  rowEl.style.width = rect.width + 'px';
  rowEl.style.top = rect.top + 'px';
  rowEl.style.left = rect.left + 'px';
  rowEl.style.zIndex = '300';
  rowEl.style.margin = '0';
  rowEl.classList.add('row-dragging');
  requestAnimationFrame(() => rowEl.classList.add('row-lifted'));
  // Create placeholder at end of list (not in-place)
  const wrapper = document.getElementById('grid-wrapper');
  if (wrapper) {
    let ph = wrapper.querySelector('.row-drag-placeholder');
    if (ph) ph.remove();
    ph = document.createElement('div');
    ph.className = 'row row-drag-placeholder';
    ph.style.height = rowH + 'px';
    ph.style.visibility = 'hidden';
    wrapper.appendChild(ph);
    requestAnimationFrame(() => { ph.style.visibility = 'visible'; });
  }
  rowDragState = {
    rowId, fromIdx, insertBefore: null, source,
    startMouseY: e.clientY,
    startElTop: rect.top,
    rowH,
  };
  document.body.classList.add('row-reordering');
  if (rowDragIndicator) rowDragIndicator.style.display = 'block';
}

// --- Drag: Move ---
function startMove(e, blockId) {
  e.preventDefault();
  const block = blocks.find(b => b.id === blockId);
  if (!block || isDataBlock(block)) return;

  dragState = {
    type: 'move',
    blockId,
    startX: e.clientX,
    startY: e.clientY,
    origStart: block.start,
    origRowId: block.rowId,
    moved: false, // becomes true once cursor passes the drag threshold
  };
  // Don't add .dragging or call render() yet — wait until real movement so
  // single clicks (and dblclicks) don't rebuild the DOM and lose element identity.
}

// --- Drag: Resize ---
function startResize(e, blockId, side) {
  e.preventDefault();
  e.stopPropagation();
  const block = blocks.find(b => b.id === blockId);
  if (!block || isDataBlock(block)) return;

  dragState = {
    type: side === 'left' ? 'resize-left' : 'resize-right',
    blockId,
    startX: e.clientX,
    startY: e.clientY,
    origStart: block.start,
    origDuration: block.duration,
    origBaseDuration: getBlockBaseDuration(block),
    origCapacity: getRowCapacity(rows.find(r => r.id === block.rowId)),
    moved: false,
  };
}

const DRAG_THRESHOLD_PX = 4;

function updateBlockStartTooltip(bEl, block) {
  if (!bEl || !block) return;
  let tip = bEl.querySelector('.block-start-tooltip');
  if (!tip) {
    tip = document.createElement('div');
    tip.className = 'block-start-tooltip';
    bEl.appendChild(tip);
  }
  tip.textContent = formatDateFull(colToDate(block.start));
}

function removeBlockStartTooltip(bEl) {
  const tip = bEl && bEl.querySelector('.block-start-tooltip');
  if (tip) tip.remove();
}

document.addEventListener('mousemove', (e) => {
  if (dragState) {
    const block = blocks.find(b => b.id === dragState.blockId);
    if (!block) return;

    const dx = e.clientX - dragState.startX;
    const dy = (e.clientY - (dragState.startY || e.clientY));

    // Suppress drag until the cursor has actually moved past the threshold —
    // otherwise plain clicks rebuild the DOM and break dblclick.
    if (!dragState.moved) {
      if (Math.abs(dx) < DRAG_THRESHOLD_PX && Math.abs(dy) < DRAG_THRESHOLD_PX) return;
      dragState.moved = true;
    }

    const colDelta = Math.round(dx / dayPx());
    const bEl = document.querySelector(`[data-block-id="${dragState.blockId}"]`);
    const cEl = document.querySelector(`[data-contingency-for="${dragState.blockId}"]`);
    const capEl = document.querySelector(`[data-capacity-for="${dragState.blockId}"]`);

    const updateExtensions = () => {
      const baseDuration = getBlockBaseDuration(block);
      const capacityDays = Math.max(0, block.duration - baseDuration);
      const extraDays = contingencyPct > 0 ? Math.round(block.duration * contingencyPct / 100) : 0;
      const baseExtraDays = contingencyPct > 0 ? Math.round(baseDuration * contingencyPct / 100) : 0;
      const capacityExtraDays = Math.max(0, extraDays - baseExtraDays);

      if (cEl) {
        cEl.style.left = (baseDuration * dayPx() - 2) + 'px';
        cEl.style.width = (baseExtraDays * dayPx()) + 'px';
      }
      if (capEl) {
        capEl.style.left = ((block.start + baseDuration + baseExtraDays) * dayPx()) + 'px';
        capEl.style.width = ((capacityDays + capacityExtraDays) * dayPx() - 2) + 'px';
      }
    };

    if (dragState.type === 'move') {
      block.start = Math.max(0, dragState.origStart + colDelta);

      // Check if we should move to a different row
      const gridArea = document.getElementById('grid-area');
      const lanes = gridArea.querySelectorAll('.row-cells[data-row-id][data-track-id]');
      for (const lane of lanes) {
        const rect = lane.getBoundingClientRect();
        if (e.clientY >= rect.top && e.clientY < rect.bottom) {
          const rowId = parseInt(lane.dataset.rowId);
          const trackId = lane.dataset.trackId;
          if (rowId && (rowId !== block.rowId || trackId !== block.trackId)) {
            const newRow = rows.find(r => r.id === rowId);
            block.baseDuration = getBlockBaseDuration(block);
            block.duration = adjustedDurationForCapacity(block.baseDuration, 100, getRowCapacity(newRow));
            block.rowId = rowId;
            block.trackId = trackId;
            // Move bEl to the new track lane; contingency auto-follows as a child of bEl
            if (bEl) lane.appendChild(bEl);
            if (capEl) lane.appendChild(capEl);
            if (bEl) {
              bEl.style.width = (getBlockBaseDuration(block) * dayPx() - 2) + 'px';
              const badge = bEl.querySelector('.block-days-badge');
              if (badge) badge.innerHTML = fmtBlockDuration(block);
            }
          }
          break;
        }
      }

      // Update position in-place (no full render during drag)
      if (bEl) {
        bEl.style.left = (block.start * dayPx()) + 'px';
        bEl.classList.add('dragging');
      }
      updateExtensions();
    }
    else if (dragState.type === 'resize-right') {
      block.baseDuration = Math.max(1, dragState.origBaseDuration + colDelta);
      block.duration = adjustedDurationForCapacity(block.baseDuration, 100, dragState.origCapacity);
      if (bEl) {
        bEl.style.width = (getBlockBaseDuration(block) * dayPx() - 2) + 'px';
        const badge = bEl.querySelector('.block-days-badge');
        if (badge) badge.innerHTML = fmtBlockDuration(block);
      }
      updateExtensions();
    }
    else if (dragState.type === 'resize-left') {
      const newStart = dragState.origStart + colDelta;
      const newBaseDuration = dragState.origBaseDuration - colDelta;
      if (newBaseDuration >= 1 && newStart >= 0) {
        block.start = newStart;
        block.baseDuration = newBaseDuration;
        block.duration = adjustedDurationForCapacity(block.baseDuration, 100, dragState.origCapacity);
        if (bEl) {
          bEl.style.left = (block.start * dayPx()) + 'px';
          bEl.style.width = (getBlockBaseDuration(block) * dayPx() - 2) + 'px';
          const badge = bEl.querySelector('.block-days-badge');
          if (badge) badge.innerHTML = fmtBlockDuration(block);
        }
        updateExtensions();
      }
    }

    if (bEl) updateBlockStartTooltip(bEl, block);
  }

  // Row reorder drag
  if (rowDragState) {
    const { rowId, source } = rowDragState;
    const isPanel = source === 'panel';
    const elList = isPanel
      ? [...document.querySelectorAll('.panel-section-header[data-row-id]')]
      : [...document.querySelectorAll('.row[data-row-id]')];
    const dragged = document.querySelector(`.${isPanel ? 'panel-section-header' : 'row'}[data-row-id="${rowId}"]`);

    // Hit-test: panel source → other panel section headers; grid source → other grid rows.
    let insertBefore = null;
    let indicatorY = null;
    let targetEl = null;

    for (let i = 0; i < elList.length; i++) {
      const rect = elList[i].getBoundingClientRect();
      const rId = parseInt(elList[i].dataset.rowId);
      if (rId === rowId) continue;
      const midY = rect.top + rect.height / 2;
      if (e.clientY < midY) {
        insertBefore = rId;
        indicatorY = rect.top;
        targetEl = elList[i];
        break;
      }
      indicatorY = rect.bottom;
    }

    // Move dragged row to follow cursor
    const dy = e.clientY - rowDragState.startMouseY;
    dragged.style.transform = `translateY(${dy}px)`;
    dragged.style.transition = 'none';

    // Compute where the dragged row's center is in document space
    const draggedRect = dragged.getBoundingClientRect();
    const draggedCenterDocY = draggedRect.top + draggedRect.height / 2;

    // Find which row slot the dragged center is over — traverse the LIVE DOM order
    // (which reflects the current rows[] order plus our transforms)
    const liveRows = [...document.querySelectorAll('.row[data-row-id]')].filter(r =>
      !r.classList.contains('row-drag-placeholder') && String(r.dataset.rowId) !== String(rowId)
    );

    let newInsertBefore = null;
    for (const r of liveRows) {
      const rect = r.getBoundingClientRect();
      if (draggedCenterDocY < rect.top + rect.height / 2) {
        newInsertBefore = parseInt(r.dataset.rowId);
        break;
      }
    }

    // Compute shift direction and magnitude from current insertBefore (not fromIdx)
    // This is the key: rows only shift by ONE slot at a time as insertBefore changes
    const prevInsertBefore = rowDragState.insertBefore;
    const prevInsertIdx = prevInsertBefore !== null
      ? rows.findIndex(r => r.id === prevInsertBefore)
      : rows.length;
    const newInsertIdx = newInsertBefore !== null
      ? rows.findIndex(r => r.id === newInsertBefore)
      : rows.length;

    // Reset all non-dragged rows to their natural position first
    liveRows.forEach(r => {
      r.style.transform = '';
      r.style.transition = 'transform 0.2s ease, opacity 0.15s ease';
      r.style.opacity = '';
    });

    // Then shift rows between prev and new insert positions
    const minI = Math.min(prevInsertIdx, newInsertIdx);
    const maxI = Math.max(prevInsertIdx, newInsertIdx);
    if (newInsertIdx < rows.length) {
      liveRows.forEach(r => {
        const idx = rows.findIndex(row => String(row.id) === String(r.dataset.rowId));
        if (idx > minI && idx <= maxI) {
          const dir = newInsertIdx < prevInsertIdx ? 1 : -1;
          r.style.transform = `translateY(${dir * rowDragState.rowH}px)`;
        }
      });
    }

    rowDragState.insertBefore = newInsertBefore;
    rowDragState.insertIdx = newInsertIdx;

    if (indicatorY !== null && rowDragIndicator) {
      rowDragIndicator.style.top = (indicatorY - 1) + 'px';
      if (isPanel) {
        const panelRect = document.getElementById('data-panel').getBoundingClientRect();
        rowDragIndicator.style.left = panelRect.left + 'px';
        rowDragIndicator.style.width = panelRect.width + 'px';
      } else {
        rowDragIndicator.style.left = '0';
        rowDragIndicator.style.width = headerWidth + 'px';
      }
    }
  }

  // Create by drag preview
  if (createState) {
    const cells = document.querySelector(`.row-cells[data-row-id="${createState.rowId}"][data-track-id="${createState.trackId}"]`);
    if (cells && createState.preview) {
      const r = cells.getBoundingClientRect();
      const x = e.clientX - r.left;
      const endCol = Math.max(0, Math.floor(x / dayPx()));
      const start = Math.min(createState.startCol, endCol);
      const end = Math.max(createState.startCol, endCol);
      createState.currentCol = endCol;
      createState.preview.style.left = (start * dayPx()) + 'px';
      createState.preview.style.width = ((end - start + 1) * dayPx()) + 'px';
    }
  }
});

document.addEventListener('mouseup', (e) => {
  if (rowDragState) {
    const { rowId, insertBefore } = rowDragState;
    document.body.classList.remove('row-reordering');
    if (rowDragIndicator) rowDragIndicator.style.display = 'none';

    // Reset all transforms
    document.querySelectorAll('.row').forEach(r => {
      r.style.transform = '';
      r.style.transition = '';
      r.style.opacity = '';
    });

    // Reset dragged row styling
    const dragged = document.querySelector('.row.row-dragging');
    if (dragged) {
      dragged.style.position = '';
      dragged.style.top = '';
      dragged.style.left = '';
      dragged.style.width = '';
      dragged.style.zIndex = '';
      dragged.style.transform = '';
      dragged.classList.remove('row-dragging', 'row-lifted');
    }

    // Remove placeholder
    const ph = document.querySelector('.row-drag-placeholder');
    if (ph) ph.remove();

    // Apply state change
    const fromIdx = rows.findIndex(r => r.id === rowId);
    if (fromIdx !== -1) {
      const [moved] = rows.splice(fromIdx, 1);
      const toIdx = insertBefore !== null ? rows.findIndex(r => r.id === insertBefore) : rows.length;
      rows.splice(toIdx === -1 ? rows.length : toIdx, 0, moved);
      // Reorder DOM to match rows[]
      const wrapper = document.getElementById('grid-wrapper');
      const addRowEl = wrapper.querySelector('.add-row-btn')?.closest('.row');
      rows.forEach(row => {
        const el = wrapper.querySelector(`.row[data-row-id="${row.id}"]`);
        if (el && el !== addRowEl) wrapper.insertBefore(el, addRowEl);
      });
      renderPanel();
      saveState();
    }

    rowDragState = null;
    return;
  }

  if (dragState) {
    const wasMoved = dragState.moved;
    const draggedId = dragState.blockId;
    dragState = null;
    if (wasMoved) {
      // In-place updates already moved/resized the element. Just persist
      // and clean up the dragging class — no need for a full render.
      const el = document.querySelector(`[data-block-id="${draggedId}"]`);
      if (el) {
        el.classList.remove('dragging');
        removeBlockStartTooltip(el);
      }
      saveState();
      render();
    }
  }

  if (createState) {
    const rect = document.querySelector(`.row-cells[data-row-id="${createState.rowId}"][data-track-id="${createState.trackId}"]`);
    if (rect) {
      const r = rect.getBoundingClientRect();
      const x = e.clientX - r.left;
      const endCol = Math.max(0, Math.floor(x / dayPx()));
      const start = Math.min(createState.startCol, endCol);
      const end = Math.max(createState.startCol, endCol);
      const duration = end - start + 1;

      if (duration >= 2) {
        createBlock(createState.rowId, start, duration, '', false, 'grid', createState.trackId);
      } else if (createState.preview) {
        createState.preview.remove();
      }
    } else if (createState.preview) {
      createState.preview.remove();
    }
    createState = null;
  }
});

// --- Context menu ---
function showBlockColorMenu(e, blockId) {
  e.preventDefault();
  e.stopPropagation();
  const menu = document.getElementById('context-menu');
  const block = blocks.find(b => b.id === blockId);
  if (!block) return;

  const menuW = 180, menuH = 120;
  const left = Math.min(e.clientX, window.innerWidth - menuW - 8);
  const top  = Math.min(e.clientY, window.innerHeight - menuH - 8);
  menu.style.display = 'block';
  menu.style.left = left + 'px';
  menu.style.top  = top  + 'px';
  menu.innerHTML = '';

  const label = document.createElement('div');
  label.className = 'context-menu-label';
  label.textContent = 'Colour';
  menu.appendChild(label);

  const grid = document.createElement('div');
  grid.className = 'color-swatch-grid';
  for (let i = 0; i < COLORS; i++) {
    const sw = document.createElement('div');
    sw.className = `color-swatch block-color-${i}`;
    if (i === block.color) sw.classList.add('selected');
    sw.addEventListener('click', () => {
      block.color = i;
      render();
      saveState();
      menu.style.display = 'none';
    });
    grid.appendChild(sw);
  }
  menu.appendChild(grid);
}

function showBlockContextMenu(e, blockId) {
  const menu = document.getElementById('context-menu');
  const block = blocks.find(b => b.id === blockId);
  if (!block) return;

  // Position — clamp to viewport edges
  const menuW = 180, menuH = 170;
  const left = Math.min(e.clientX, window.innerWidth - menuW - 8);
  const top  = Math.min(e.clientY, window.innerHeight - menuH - 8);
  menu.style.display = 'block';
  menu.style.left = left + 'px';
  menu.style.top  = top  + 'px';

  menu.innerHTML = '';

  // Colour label
  const label = document.createElement('div');
  label.className = 'context-menu-label';
  label.textContent = 'Colour';
  menu.appendChild(label);

  // Swatch grid
  const grid = document.createElement('div');
  grid.className = 'color-swatch-grid';
  for (let i = 0; i < COLORS; i++) {
    const sw = document.createElement('div');
    sw.className = `color-swatch block-color-${i}`;
    if (i === block.color) sw.classList.add('selected');
    sw.addEventListener('click', () => {
      block.color = i;
      render();
      saveState();
      menu.style.display = 'none';
    });
    grid.appendChild(sw);
  }
  menu.appendChild(grid);

  const lockItem = document.createElement('label');
  lockItem.className = 'context-menu-item';
  const lockInput = document.createElement('input');
  lockInput.type = 'checkbox';
  lockInput.checked = isDataBlock(block);
  lockInput.addEventListener('change', () => {
    block.kind = lockInput.checked ? 'data' : 'grid';
    render();
    saveState();
    menu.style.display = 'none';
  });
  lockItem.appendChild(lockInput);
  lockItem.appendChild(document.createTextNode('Lock'));
  menu.appendChild(lockItem);

  // Separator
  const sep = document.createElement('div');
  sep.className = 'context-menu-separator';
  menu.appendChild(sep);

  // Delete
  const del = document.createElement('div');
  del.className = 'context-menu-item danger';
  del.textContent = 'Delete';
  del.addEventListener('click', () => { deleteBlock(blockId); saveState(); });
  menu.appendChild(del);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.context-menu')) {
    document.getElementById('context-menu').style.display = 'none';
  }
});

function renameBlock(id) {
  document.getElementById('context-menu').style.display = 'none';
  const block = blocks.find(b => b.id === id);
  if (!block) return;
  const name = prompt('Block name:', block.label || '');
  if (name !== null) { block.label = name; render(); }
}

function cycleColor(id) {
  document.getElementById('context-menu').style.display = 'none';
  const block = blocks.find(b => b.id === id);
  if (!block) return;
  block.color = (block.color + 1) % COLORS;
  render();
}

function duplicateBlock(id) {
  document.getElementById('context-menu').style.display = 'none';
  const block = blocks.find(b => b.id === id);
  if (!block) return;
  const clone = createBlock(block.rowId, block.start + block.duration + 1, getBlockBaseDuration(block), block.label, false, block.kind || 'grid', block.trackId);
  clone.color = block.color;
  render();
}

// --- Zoom ---
function syncViewButtons() {
  const btn = document.querySelector('.zoom-select-btn');
  if (btn) btn.childNodes[0].nodeValue = ZOOM_LABELS[zoom] || zoom;
  document.querySelectorAll('.zoom-menu button').forEach(item => item.classList.toggle('active', item.textContent === (ZOOM_LABELS[zoom] || zoom)));
  document.getElementById('btn-table')?.classList.toggle('active', zoom === 'table');
  document.getElementById('btn-map')?.classList.toggle('active', zoom !== 'table');
}

const MAP_ZOOM_LEVELS = ['month', 'week', 'day', 'day-large', 'day-half'];
const ZOOM_LABELS = { month: 'Month', week: 'Week', day: 'Day', 'day-large': 'Day+', 'day-half': '½ Day' };
let _lastZoomWheelAt = 0;

function setZoom(z, anchorClientX = null) {
  const gridArea = document.getElementById('grid-area');
  const oldZoom = zoom;
  const oldDayPx = dayPx();
  let anchorOffset = null;
  let anchorCol = null;

  if (gridArea && oldZoom !== 'table' && z !== 'table') {
    const rect = gridArea.getBoundingClientRect();
    anchorOffset = anchorClientX == null ? gridArea.clientWidth / 2 : Math.max(0, Math.min(gridArea.clientWidth, anchorClientX - rect.left));
    anchorCol = (gridArea.scrollLeft + anchorOffset) / oldDayPx;
  }

  zoom = z;
  if (z !== 'table') mapZoom = z;
  syncViewButtons();
  render();

  if (gridArea && anchorCol != null) {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        gridArea.scrollLeft = Math.max(0, anchorCol * dayPx() - anchorOffset);
      });
    });
  }
  saveState();
}

function zoomRelative(direction, anchorClientX = null) {
  if (zoom === 'table') return;
  const idx = MAP_ZOOM_LEVELS.indexOf(zoom);
  if (idx === -1) return;
  const nextIdx = Math.max(0, Math.min(MAP_ZOOM_LEVELS.length - 1, idx + direction));
  if (nextIdx !== idx) setZoom(MAP_ZOOM_LEVELS[nextIdx], anchorClientX);
}

function toggleZoomMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('zoom-menu');
  if (menu) menu.hidden = !menu.hidden;
}

function selectZoomLevel(level) {
  const menu = document.getElementById('zoom-menu');
  if (menu) menu.hidden = true;
  setZoom(level);
}

function onTimelineWheel(e) {
  if (zoom === 'table' || (!e.ctrlKey && !e.metaKey)) return;
  e.preventDefault();
  const now = Date.now();
  if (now - _lastZoomWheelAt < 140) return;
  _lastZoomWheelAt = now;
  zoomRelative(e.deltaY < 0 ? 1 : -1, e.clientX);
}

// --- Panel toggle ---
function jumpToToday() {
  const col = todayWeekdayCol();
  if (col === -1) return;
  const gridArea = document.getElementById('grid-area');
  const target = col * dayPx() - gridArea.clientWidth / 2;
  gridArea.scrollLeft = Math.max(0, target);
}

function scrollTimeline(direction) {
  const gridArea = document.getElementById('grid-area');
  if (!gridArea) return;
  const amount = Math.max(gridArea.clientWidth * 0.1875, dayPx() * 2);
  gridArea.scrollBy({ left: direction * amount, behavior: 'smooth' });
}

function togglePanel() {
  setZoom('table');
}

// --- Settings ---
function updateContingency() {
  const input = document.getElementById('contingency');
  contingencyPct = parseInt(input ? input.value : contingencyPct) || 0;
  contingencyPct = Math.max(0, Math.min(100, contingencyPct));
  render();
}

// --- Keyboard ---
document.addEventListener('click', () => {
  const menu = document.getElementById('zoom-menu');
  if (menu) menu.hidden = true;
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('context-menu').style.display = 'none';
    const menu = document.getElementById('zoom-menu');
    if (menu) menu.hidden = true;
  }
  if ((e.metaKey || e.ctrlKey) && (e.key === '+' || e.key === '=')) {
    e.preventDefault();
    zoomRelative(1);
  }
  if ((e.metaKey || e.ctrlKey) && e.key === '-') {
    e.preventDefault();
    zoomRelative(-1);
  }
});

// v1 → v2 migration: v1 stored cols as calendar-day indices (weekends included);
// v2 stores weekday-only indices. Convert each block's start+duration.
// projectStart in v1 was always a Monday, and col 0 = calendar day 0 = Monday,
// so calendar cols where (col % 7) is 5 or 6 were weekends.
function migrateV1ToV2(savedBlocks) {
  const calIsWeekend = (col) => (col % 7) === 5 || (col % 7) === 6;
  const calToWeekday = (col) => {
    let n = 0;
    for (let c = 0; c < col; c++) if (!calIsWeekend(c)) n++;
    return n;
  };
  return (savedBlocks || []).map(b => {
    // If the block started on a weekend, snap forward to the next weekday.
    let start = b.start;
    while (calIsWeekend(start)) start++;
    const newStart = calToWeekday(start);
    // Count weekdays actually covered by the original span.
    let newDuration = 0;
    for (let c = b.start; c < b.start + b.duration; c++) {
      if (!calIsWeekend(c)) newDuration++;
    }
    if (newDuration < 1) newDuration = 1;
    return { ...b, start: newStart, duration: newDuration };
  });
}

// --- Init ---
async function init() {
  setupAuthUI();
  let user = null;
  try {
    user = await requireAuth();
  } catch (e) {
    document.getElementById('auth-error').textContent = e.message || String(e);
    setSyncStatus('error', 'Unauthorized');
    return;
  }
  if (!user) {
    setSyncStatus('offline', 'Locked');
    return;
  }
  showSignedIn(user);
  const saved = await loadState();
  _saveReady = true;
  if (saved) {
    // Restore state (Firestore or IndexedDB)
    rows = saved.rows || rows;
    normalizeRows();
    rowHeights = saved.rowHeights || {};
    // Track heights come through saved.rows (sanitizeState seeds legacy rows from
    // rowHeights). Re-applying the stale rowHeights map here would undo resizes.
    blocks = saved.blocks || [];
    // v1 state had no version field and used calendar-day columns.
    if (!saved.version || saved.version < 2) {
      blocks = migrateV1ToV2(blocks);
      console.log('migrated', blocks.length, 'blocks from v1 (calendar) to v2 (weekday)');
    }
    normalizeBlocks();
    nextBlockId = saved.nextBlockId || (blocks.reduce((m, b) => Math.max(m, b.id), 0) + 1);
    nextRowId = saved.nextRowId || (rows.reduce((m, r) => Math.max(m, r.id), 0) + 1);
    contingencyPct = saved.contingencyPct || 0;
    zoom = saved.zoom || 'day';
    if (typeof saved.panelWidth === 'number') panelWidth = saved.panelWidth;
    if (typeof saved.headerWidth === 'number') headerWidth = saved.headerWidth;
    if (typeof saved.resourceSummaryWidth === 'number') resourceSummaryWidth = saved.resourceSummaryWidth;
    if (saved.collapsedRows && typeof saved.collapsedRows === 'object') collapsedRows = saved.collapsedRows;
    // projectStart is generated dynamically; intentionally ignore saved.projectStart.
    const contingencyInput = document.getElementById('contingency');
    if (contingencyInput) contingencyInput.value = contingencyPct;
    syncViewButtons();
  } else {
    normalizeRows();
    // First run: seed example blocks
    createBlock(1, 0, 5, 'Planning');
    createBlock(1, 6, 8, 'Design');
    createBlock(2, 3, 10, 'Frontend');
    createBlock(3, 8, 12, 'Backend');
    createBlock(2, 14, 6, 'Testing');
    saveState(); // write seed data to Firestore immediately
  }

  rowDragIndicator = document.createElement('div');
  rowDragIndicator.className = 'row-reordering-indicator';
  document.body.appendChild(rowDragIndicator);
  listenForChanges(); // start real-time sync
  applyHeaderWidth(); // apply saved header-column width before first render
  applyRowHeights(); // apply saved row heights before first render
  render();
  const gridArea = document.getElementById('grid-area');
  gridArea.addEventListener('mousedown', startPan);
  gridArea.addEventListener('wheel', onTimelineWheel, { passive: false });
}

init();
</script>
